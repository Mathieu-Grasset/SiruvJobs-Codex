ions : toi seul peux les casser.","more":["La TNT que tu poses explose normalement, mais ne détruit pas tes propres bâtiments.","S'applique aussi aux bâtiments construits avant le niveau 60, et reste actif quand tu es hors ligne.","Les bâtiments posés autrement qu'avec un plan ne sont pas protégés."]},{"lvl":90,"title":"Aplanir avant de construire","text":"Si la zone d'un plan n'est pas dégagée, une touche dédiée l'aplanit puis construit, au lieu de refuser la pose.","more":["Les blocs ainsi détruits ne rapportent ni XP ni objets.","Si la zone contient un coffre ou un autre bloc à contenu, rien n'est détruit et la pose est refusée.","Une construction qui a aplani quelque chose ne peut plus être annulée avec /undo. Sur une zone déjà dégagée, la touche construit normalement et /undo reste possible."]},{"lvl":100,"title":"Récupérer un bâtiment","text":"Remets un bâtiment construit avec un plan dans un plan vide correspondant (officiel ou personnalisé) : le bâtiment est démonté et le plan se remplit.","more":["Clic droit simple : affiche le pourcentage récupérable. Maj + clic droit : lance la récupération.","Seul le Bâtisseur qui a construit le bâtiment peut le récupérer. Un bâtiment abîmé ou modifié se récupère en partie.","Aucune XP n'est donnée. Le plan rempli ainsi ne peut plus être vidé pour reprendre les ressources, mais sert à reconstruire normalement.","Pour un plan officiel, 95 % récupérés comptent comme un plan plein. Les créatures apparues à la construction sont retirées."]}],"xnotes":{"goals":["Bonus de premier plan : par exemple 1 000 XP la première fois que tu construis un plan qui demande le niveau 10. Reconstruire le même plan ne le redonne pas.","Les bonus de premier bloc, de premier plan et de type de bâtiment se cumulent sur une même construction. Un bâtiment qui a plusieurs types cumule leurs bonus."],"xp":["/undo retire le bâtiment et l'XP qu'il t'a rapportée, bonus compris ; tu pourras regagner ces bonus en le reconstruisant."],"plans":["Certains blocs d'un plan sont offerts : ils sont construits mais n'apparaissent pas dans son coût (par exemple les vitres de la cabane, les tonneaux de la réserve, l'enclume et le chaudron de lave de la forge, les plantes aquatiques)."]}},"bucheron":{"id":"bucheron","title":"BÛCHERON","sections":{"GAIN D'XP":["4 XP par bloc de bois coupé.","25 XP quand une pousse que tu as plantée devient un arbre, qu'elle pousse seule, à la poudre d'os ou grâce au passif du niveau 90. Il faut être connecté à ce moment-là."],"CHOIX DU MÉTIER":["+10 % de vitesse de bûcheronnage à l'embauche, puis +1 % par niveau."]},"tiers":[{"lvl":10,"A":"Une pousse repousse automatiquement après l'abattage","B":"20 % de chance de doubler le bois coupé","nA":"La pousse replantée correspond à l'essence coupée. Les bois du Nether n'ont pas de pousse et ne repoussent pas."},{"lvl":30,"A":"Couper la base d'un tronc fait tomber tout le tronc au-dessus","B":"Grimpe aux troncs comme à une échelle","nA":"Chaque bûche qui tombe rapporte son XP, pas seulement celle que tu as coupée.","nB":"Pousse contre un tronc pour monter."},{"lvl":50,"A":"Le tronc tombe, et les feuilles de l'arbre abattu tombent aussi (comme avec Toucher de soie). /feuilles active ou désactive ce drop de feuilles","B":"Aucun dégât de chute en tombant d'un bloc de feuilles rattaché à un tronc","nA":"Le tronc continue de tomber dans tous les cas, que le drop de feuilles soit activé ou non."},{"lvl":75,"A":"Couper n'importe quel bloc du tronc fait tomber tout l'arbre, branches comprises","B":"Planter un arbre : 5 % de chance qu'un animal apparaisse quand il a poussé","nA":"Suit les branches dans toutes les directions, jusqu'à 256 blocs. Deux arbres collés peuvent tomber ensemble.","nB":"Un lapin pour un chêne, un renard pour un épicéa, un perroquet pour un arbre de jungle ; les autres essences ne font rien apparaître. L'animal est sauvage et peut disparaître comme les autres."},{"lvl":100,"A":"Commande /deforestation","B":"Commande /woodseed","nA":"Abat tous les arbres à moins de 16 blocs, jusqu'à 2 000 blocs par utilisation. Recharge : 30 min.","nB":"Donne une pousse de chaque arbre du jeu. Recharge : 8 h."}],"goals":[["Première bûche de chaque essence coupée","100 XP","first"],["Première pousse de chaque essence plantée","100 XP","first"],["Toutes les essences de l'Overworld coupées (10)","10 000 XP","all"],["Toutes les pousses plantées (12, dont les deux azalées)","10 000 XP","all"]],"passives":[{"lvl":20,"title":"Écorçage","text":"Écorcer un arbre rapporte autant d'XP que le couper."},{"lvl":40,"title":"Cueillette","text":"10 % de chance de trouver de la nourriture en coupant du bois : tranche de pastèque en jungle, baies sucrées en taïga, pomme ailleurs.","more":["Avec B1, cette nourriture peut aussi être doublée."]},{"lvl":60,"title":"Hachoir affûté","text":"Ta hache frappe comme une épée du même matériau : mêmes dégâts, même cadence.","more":["Efficacité compte comme Tranchant pour les dégâts : c'est le plus haut des deux qui s'applique, jamais la somme."]},{"lvl":90,"title":"Pouce vert","text":"Une pousse que tu plantes pousse toute seule après environ 5 secondes.","more":["Le délai laisse le temps de planter 4 pousses pour les gros arbres (chêne noir, jungle…).","Déterrer la pousse avant la fin du délai annule la pousse automatique."]}],"xnotes":{"goals":["Les bois du Nether (carmin et biscornu) rapportent l'XP normale et le bonus de première essence, mais ne comptent pas pour le bonus des 10 essences."]}},"chasseur":{"id":"chasseur","title":"CHASSEUR","sections":{"GAIN D'XP":["15 XP par monstre tué.","8 XP par animal ou créature passive tué."],"CHOIX DU MÉTIER":["+10 % d'XP de métier sur les monstres et les animaux à l'embauche, puis +1 % par niveau.","5 % de chance d'obtenir un butin rare à chaque mise à mort : une fois sur deux une fiole d'expérience, sinon une émeraude, un diamant, une selle ou une étiquette."]},"tiers":[{"lvl":10,"A":"+10 % de force des coups contre les monstres","B":"25 % de chance de doubler le butin"},{"lvl":30,"A":"+20 % de vitesse d'attaque : tes coups reviennent plus vite à pleine puissance","B":"Double la chance de butin rare (10 %)"},{"lvl":50,"A":"Combine à l'enclume deux enchantements normalement incompatibles","B":"Combine à l'enclume deux enchantements normalement incompatibles","shared":true,"nA":"Par exemple Tranchant avec Fléau des arthropodes, ou Protection avec Protection contre les explosions. Ne fonctionne pas à la table d'enchantement."},{"lvl":75,"A":"Double l'XP Minecraft (orbes) des monstres que tu tues","B":"Double l'XP Minecraft (orbes) des monstres que tu tues","shared":true,"nA":"Pas sur les animaux. L'XP du métier ne change pas."},{"lvl":100,"A":"Double les dégâts à l'arc","B":"50 % de chance de butin rare à chaque mise à mort","nB":"Remplace les 10 % de B2."}],"goals":[["Premier monstre ou animal de chaque espèce tué","100 XP","first"],["Toutes les espèces de l'Overworld tuées (69)","10 000 XP","all"],["Toutes les espèces d'animaux tuées","5 000 XP","all"],["Toutes les espèces du Nether tuées (10)","5 000 XP","all"],["Toutes les espèces de l'End tuées (4)","5 000 XP","all"]],"passives":[{"lvl":20,"title":"Antidote","text":"Tu deviens insensible au poison.","more":["Les potions de dégâts instantanés font toujours mal."]},{"lvl":40,"title":"Démineur","text":"Tu deviens insensible aux explosions de creeper."},{"lvl":60,"title":"/fly","text":"Vole pendant 3 secondes.","more":["Recharge : 5 min, comptée dès que tu tapes la commande."]},{"lvl":90,"title":"/immun","text":"Invincibilité de 2 secondes, déclenchée à ton prochain clic droit, même dans le vide.","more":["Recharge : 30 min, comptée dès que tu tapes la commande."]}],"xnotes":{"xp":["Pour que la mise à mort rapporte de l'XP ou un bonus, tu dois avoir infligé toi-même au moins la moitié des dégâts. Le butin rare suit les mêmes règles."],"goals":["Overworld : toutes les espèces qu'on croise hors du Nether et de l'End, y compris poissons, calmars, dauphins et chauves-souris.","Nether : blaze, ghast, hoglin, cube de magma, piglin, piglin barbare, arpenteur, wither squelette, zoglin, piglin zombifié.","End : Ender Dragon, enderman, endermite, shulker. L'enderman et l'endermite comptent aussi pour l'Overworld.","Un animal tué compte à la fois pour le bonus des animaux et pour celui de l'Overworld."]}},"eleveur":{"id":"eleveur","title":"ÉLEVEUR","sections":{"GAIN D'XP":["XP à chaque naissance que tu provoques et à chaque animal apprivoisé, selon la rareté de l'espèce : 25, 50 ou 100 XP.","15 XP par œuf ramassé, lait collecté, tonte, ou récolte de miel d'une ruche pleine (fiole ou rayons)."],"CHOIX DU MÉTIER":["Donne un couple de vaches, qui t'appartiennent. Il n'est offert qu'une fois : quitter puis reprendre le métier ne le redonne pas.","Chaque niveau augmente de 1 % l'XP du métier. Au niveau 100, un métier de ton choix reçoit +20 % d'XP avec /jobs boost <métier>."]},"tiers":[{"lvl":10,"A":"20 % de chance d'obtenir une laine ou un œuf en plus, et de garder ton seau vide en trayant","B":"Tes animaux arrêtent plus vite de fuir après avoir été frappés","nA":"La laine en plus ne concerne que les moutons."},{"lvl":30,"A":"25 % de chance de jumeaux, avec l'XP qui va avec","B":"Les bébés grandissent 30 % plus vite à 32 blocs autour de toi","nA":"Le second bébé est de la même espèce, mais pas forcément de la même couleur ni du même marquage. Ne concerne pas les tortues.","nB":"Ne concerne pas les grenouilles."},{"lvl":50,"A":"50 % de chance de ne pas consommer la nourriture en nourrissant un animal","B":"Le passage à l'âge adulte rapporte 25 XP de plus (40 XP au total)","nA":"Un animal nourri peut se reproduire à nouveau tout de suite : ce pouvoir fait durer ton stock de nourriture.","nB":"Sans ce pouvoir, chaque animal à toi qui grandit rapporte déjà 15 XP. Ne concerne pas les grenouilles."},{"lvl":75,"A":"Tes nouveau-nés ont toujours +10 % de vitesse","B":"Nourrir un animal le soigne entièrement","nB":"Fonctionne même si l'animal ne se reproduit pas, par exemple un bébé."},{"lvl":100,"A":"Permet de prendre le métier Fermier dès le niveau 50 (il faut un emplacement de métier libre)","B":"Permet de prendre le métier Fermier dès le niveau 50 (il faut un emplacement de métier libre)","shared":true}],"goals":[["Première naissance ou premier apprivoisement de chaque espèce","×10 l'XP","first"],["Toutes les espèces élevées, sauf le renifleur (le perroquet compte à l'apprivoisement)","5 000 XP","all"]],"passives":[{"lvl":20,"title":"Filet de capture","text":"Un objet à fabriquer (1 œuf + 1 laisse) : clic droit sur un de tes animaux pour l'emporter, clic droit ailleurs pour le relâcher.","more":["L'animal est gardé tel quel, sans mourir.","Tu peux toujours relâcher un animal, même si tu as changé de métier entre-temps."]},{"lvl":40,"title":"Instinct protecteur","text":"Tes animaux ne subissent plus de dégâts de chute ni de noyade.","more":["Seulement quand tu es connecté."]},{"lvl":60,"title":"/whistle","text":"Fait venir vers toi tes animaux à moins de 32 blocs."},{"lvl":60,"title":"Filet de capture amélioré","text":"Le filet capture aussi les créatures qui n'appartiennent à personne : animaux (vache, loup, cheval, axolotl…) et créatures aquatiques (poissons, calmars, dauphins, têtards).","more":["Une créature qui appartient à un autre joueur est toujours refusée.","Une fois relâchée, la créature t'appartient (/whistle, Instinct protecteur…), et une créature aquatique ne disparaît plus d'elle-même.","Un filet qui a capturé une créature sauvage est à usage unique : il est détruit quand tu la relâches. Capturer puis relâcher tes propres animaux rend toujours le filet vide."]},{"lvl":90,"title":"Bâton du gardien","text":"Un clic sur n'importe quel animal le rend invulnérable, un second clic annule.","more":["Le bâton ne peut pas être jeté et revient dans ton inventaire à ta mort."]}],"xnotes":{"xp":["Tes animaux : ceux nés d'un accouplement que tu as déclenché, et ceux que tu as apprivoisés. Les animaux sauvages ou ceux des autres joueurs ne comptent jamais.","Rareté : commun 25 XP (vache, cochon, poule, mouton, lapin, tortue), peu commun 50 XP (cheval, âne, mule, lama, loup, chat, perroquet, renard, chèvre, abeille), rare 100 XP (panda, axolotl, arpenteur, hoglin, grenouille, dromadaire, tatou). Animaux à apprivoiser : cheval, âne, mule, lama, loup, chat, perroquet.","Le renifleur ne rapporte pas d'XP de naissance.","Tortues : les bébés qui éclosent des œufs pondus après un accouplement que tu as déclenché te rapportent l'XP et deviennent tes animaux. Il faut être connecté au moment de l'éclosion.","Grenouilles : l'XP arrive quand un têtard issu d'un accouplement que tu as déclenché devient grenouille. Un têtard mis dans un seau puis relâché n'est plus compté comme le tien.","Un œuf qui a été jeté ne rapporte plus d'XP quand on le ramasse : seuls les œufs pondus par une poule comptent."]}},"enchanteur":{"id":"enchanteur","title":"ENCHANTEUR","sections":{"GAIN D'XP":["Table d'enchantement : 1 XP par niveau d'enchantement appliqué, +10 XP si l'objet est un livre, le tout doublé (×2).","Enclume : 1 XP par niveau d'enchantement gagné, multiplié par 5.","10 XP par livre fabriqué, sans limite.","20 XP pour chacune de tes 100 premières bibliothèques fabriquées, et 50 XP pour chacune de tes 10 premières tables d'enchantement."],"CHOIX DU MÉTIER":["Donne une table d'enchantement, une seule fois : quitter puis reprendre le métier ne la redonne pas.","Chaque niveau donne 1 livre et 10 fioles d'expérience."]},"tiers":[{"lvl":10,"A":"10 % de chance d'obtenir en plus un enchantement « trésor » (Raccommodage, Semelles givrantes), normalement impossible à la table","B":"Économise 25 % de l'XP dépensée à l'enclume","nA":"L'enchantement trésor s'ajoute à l'enchantement normal de la table et est toujours compatible avec l'objet. Son niveau suit celui des enchantements appliqués.","nB":"Réduit les niveaux réellement retirés, mais il faut toujours avoir le coût affiché pour valider."},{"lvl":30,"A":"La chance reste à 10 %, mais Agilité des âmes et Furtivité rapide s'ajoutent à la liste","B":"Commande /bottlexp","nB":"Donne une pile de fioles d'expérience. Recharge : 8 h."},{"lvl":50,"A":"+15 % de chance (25 % au total), et Rafale de vent s'ajoute à la liste","B":"Régénération passive d'XP Minecraft : 5 points toutes les 10 secondes, soit environ 1 800 par heure"},{"lvl":75,"A":"3 % de chance qu'un enchantement appliqué à la table dépasse son niveau maximum de 1 (ex. Protection V)","B":"50 % de chance qu'un objet enchanté ne perde pas de durabilité","nA":"L'enchantement amélioré n'est pas visible avant de valider ; un message dans le chat t'annonce quand ça se produit. Ne peuvent pas être améliorés : Infinité, Raccommodage, Toucher de soie, Flamme, Canalisation et les malédictions, car un niveau de plus n'y changerait rien."},{"lvl":100,"A":"Commande /immortel","B":"50 % de chance de ne dépenser ni XP ni lapis-lazuli à la table","nA":"Donne un livre à combiner à l'enclume avec une arme (1 niveau d'XP). Tiens-la en main : quand un coup devrait te tuer, tu reviens avec 50 % de tes PV ; l'arme perd l'enchantement mais n'est pas abîmée. Recharge : 48 h."}],"goals":[["Premier objet enchanté de chaque type (livre, épée, pioche, hache, pelle, houe, casque, plastron, jambières, bottes, canne à pêche, arc, arbalète, trident, masse, bouclier)","100 XP","first"],["Premier Protection IV, Tranchant IV, Fortune III, Efficacité IV, Infinité, Raccommodage, Toucher de soie","1 000 XP chacun","first"],["Tous les outils enchantés (pioche, hache, pelle, houe), quel que soit le matériau","2 000 XP","all"],["Toutes les pièces d'armure enchantées (casque, plastron, jambières, bottes)","2 000 XP","all"],["Toutes les armes enchantées (épée, arc, arbalète, trident, masse ; le bouclier ne compte pas)","2 000 XP","all"]],"passives":[{"lvl":20,"title":"Savoir","text":"+50 % d'XP de métier, en plus des multiplicateurs de la table et de l'enclume."},{"lvl":40,"title":"Balise améliorée","text":"Maj + clic droit sur une balise ouvre un écran qui l'améliore pour de bon, gratuitement.","more":["Rayon doublé par rapport à ce que donne sa pyramide.","Un 3e pouvoir au choix : un effet absent, ou le niveau supérieur d'un effet déjà présent.","Profite à tous les joueurs à proximité, même en ton absence."]},{"lvl":60,"title":"Désenchantement","text":"Tiens un objet enchanté et fais Maj + clic droit sur la table : il est transformé en livre enchanté.","more":["Une fois toutes les 8 heures. Un clic normal ouvre la table comme d'habitude."]},{"lvl":90,"title":"/resetpower","text":"Donne un livre spécial : tiens-le et tape /resetpower <métier> pour annuler le dernier pouvoir choisi dans ce métier.","more":["Recharge : 24 h."]}],"xnotes":{"hire":["À la table, seuls 1 à 3 niveaux sont réellement retirés selon le bouton choisi ; le grand nombre affiché est le niveau minimum requis. L'enclume retire tout son coût."],"goals":["Les multiplicateurs ×2 (table), ×5 (enclume) et le passif du niveau 20 ne s'appliquent pas aux bonus uniques."],"xp":["Renommer un objet à l'enclume ne rapporte pas d'XP."]}},"explorateur":{"id":"explorateur","title":"EXPLORATEUR","sections":{"GAIN D'XP":["XP selon la distance parcourue : à pied, à la nage, en barque ou sur une monture (cheval, âne, mule, lama, dromadaire, cochon ou arpenteur sellé).","100 XP quand tu es le premier joueur à ouvrir un coffre de butin généré."],"CHOIX DU MÉTIER":["+10 % de vitesse à l'embauche, puis +0,5 % par niveau."]},"tiers":[{"lvl":10,"A":"Faim réduite en déplacement : 25 % du coût du sprint, de la nage et du saut remboursé","B":"−25 % de dégâts de chute","nA":"Marcher ne coûte déjà rien."},{"lvl":30,"A":"Aucune perte de faim dans les déserts et les biomes enneigés","B":"Chute ralentie de 25 %","nB":"Ralentit la chute elle-même, ce qui réduit aussi un peu les dégâts à l'arrivée."},{"lvl":50,"A":"Commande /meal","B":"L'air sous l'eau diminue deux fois moins vite","nA":"Remplit ta faim et ta saturation. Recharge : 30 min."},{"lvl":75,"A":"Commandes /tpa <joueur> et /treasure","B":"Commandes /tpa <joueur> et /treasure","shared":true,"nA":"/tpa <joueur> : demande à te téléporter vers ce joueur, qui doit accepter avec /tpaccept dans les 60 secondes. /treasure : indique la structure à butin la plus proche dans un rayon de 1 000 blocs, comme une carte au trésor ; le butin a pu être déjà pris. Recharge : 12 h."},{"lvl":100,"A":"Commandes /spot et /tpspot","B":"Commandes /spot et /tpspot","shared":true,"nA":"/spot enregistre un point, /tpspot t'y ramène. Le point est oublié au redémarrage du serveur."}],"goals":[["Première découverte de chaque biome","100 XP","first"],["Première découverte de chaque type de structure (village, temple, donjon…)","1 000 XP","first"],["Tous les biomes de l'Overworld découverts","5 000 XP","all"],["Tous les biomes du Nether découverts","5 000 XP","all"],["Tous les biomes de l'End découverts","5 000 XP","all"],["Toutes les structures de l'Overworld découvertes","5 000 XP","all"],["Toutes les structures du Nether découvertes","5 000 XP","all"],["Toutes les structures de l'End découvertes","5 000 XP","all"]],"passives":[{"lvl":20,"title":"Mémoire du cartographe","text":"Le bouton « Objectif » de /jobs affiche, pour chaque biome et structure découvert, les coordonnées de sa première rencontre.","more":["Biome : ta position au moment de la découverte. Structure : son centre.","La liste elle-même, sans coordonnées, est visible dès le début.","Les positions sont enregistrées dès l'embauche : seule leur consultation attend le niveau 20. Elles sont effacées si tu quittes le métier."]},{"lvl":40,"title":"Sac enchanté","text":"Tiens un sac et fais Maj + clic droit sur une table d'enchantement : 6 améliorations te sont proposées dans le chat.","more":["Compartiments I, II ou III : le sac devient un petit coffre de 3, 5 ou 10 cases, chacune une pile normale.","Capacité étendue I, II ou III : le sac contient 2, 3 ou 5 fois plus.","Coût : 1 lapis + 5 niveaux, puis 2 + 15, puis 3 + 30.","Les deux améliorations ne se combinent pas ; changer de type demande un sac vide. Monter de niveau dans le même type garde le contenu.","Le sac perd sa couleur et son nom, et une pierre à aiguiser ne peut pas le désenchanter. Sur un sac à capacité étendue, maintenir le clic droit pour le vider ne marche pas : utilise le glisser-déposer."]},{"lvl":60,"title":"Marche sur l'eau","text":"Tu peux marcher et courir sur l'eau. Accroupis-toi pour plonger."},{"lvl":90,"title":"/compass","text":"/compass structure <structure> ou /compass biome <biome> indique la structure ou le biome le plus proche.","more":["Recharge : 24 h, commune aux deux.","Le fort (Stronghold) ne peut pas être localisé : il faut toujours passer par les yeux d'Ender. Un refus ne consomme pas la recharge."]}],"xnotes":{"xp":["Distance parcourue : seule la distance réelle compte. Les allers-retours, les téléportations, les trajets en wagonnet, le vol et le mode spectateur ne rapportent rien.","En barque, il faut pagayer : une barque poussée par le courant ne rapporte rien.","Le sable suspect ne compte pas comme un coffre de butin."],"goals":["Certaines variantes comptent comme un seul type de structure : les épaves (dont échouées), les ruines océaniques (froides et chaudes), les puits de mine (dont badlands), les portails en ruine de l'Overworld et les camps abandonnés. Les 5 villages restent distincts, et le portail en ruine du Nether est un type à part."]}},"fermier":{"id":"fermier","title":"FERMIER","sections":{"GAIN D'XP":["Cultures mûres (blé, carotte, pomme de terre, betterave, tiges de pastèque et de citrouille, fleur-torche, plante-amphore) : 5 XP.","Pastèque et citrouille : 5 XP. Baies sucrées récoltées : 5 XP.","Verrue du Nether et cacao mûrs : 8 XP.","Canne à sucre, cactus et bambou : 3 XP par bloc de la tige (casser la base rapporte toute la tige). Algue : 3 XP par bloc cassé."],"CHOIX DU MÉTIER":["10 % de chance d'économiser la ressource plantée à l'embauche, puis +0,5 % par niveau. Elle t'est rendue à la récolte d'une culture mûre."]},"tiers":[{"lvl":10,"A":"Tu ne piétines plus les terres cultivées, ta monture non plus","B":"3 % de chance d'obtenir une ressource rare en plus à la récolte","nB":"Carotte dorée, tranche de pastèque scintillante ou pomme dorée."},{"lvl":30,"A":"Double l'XP de métier","B":"+50 % de vitesse de croissance des cultures à 32 blocs autour de toi","nB":"Plusieurs Fermiers proches ne se cumulent pas : le meilleur bonus s'applique."},{"lvl":50,"A":"Ne fait rien","B":"Double la quantité récoltée","nA":"Palier d'attente avant A4."},{"lvl":75,"A":"Obtient directement les effets de B1, B2 et B3","B":"Les récoltes s'empilent jusqu'à 99, coffres compris"},{"lvl":100,"A":"Permet de prendre le métier Éleveur dès le niveau 50 (il faut un emplacement de métier libre)","B":"Permet de prendre le métier Éleveur dès le niveau 50 (il faut un emplacement de métier libre)","shared":true}],"goals":[["Première récolte de chaque culture ou plante","100 XP","first"],["Toutes les cultures récoltées (blé, carotte, pomme de terre, betterave, tige de pastèque, tige de citrouille, fleur-torche, plante-amphore, verrue du Nether, cacao)","5 000 XP","all"],["Toutes les autres plantes récoltées (pastèque, citrouille, canne à sucre, baies sucrées, cactus, bambou, algue)","5 000 XP","all"]],"passives":[{"lvl":20,"title":"Houe enchantée","text":"Maj + clic droit avec une houe : le chunk visé reste chargé, même quand tu es loin.","more":["Recommencer ailleurs déplace le chunk chargé."]},{"lvl":40,"title":"Replantation","text":"La graine de la culture récoltée est replantée automatiquement."},{"lvl":60,"title":"Récolte précoce","text":"Clic droit sur une culture pas encore mûre : tu récoltes une part du rendement selon sa pousse, sans détruire la plante.","more":["Par exemple ~57 % du rendement à 4/7 de croissance. Une seule fois avant la prochaine récolte normale.","Marche à main vide ou avec n'importe quel objet, sauf si tu es accroupi."]},{"lvl":90,"title":"/moissonneuse","text":"Active ou désactive la récolte et la replantation automatiques des cultures mûres sur lesquelles tu marches ou cours.","more":["Elle casse comme si tu le faisais toi-même : la replantation du niveau 40 s'applique et les zones protégées d'autres joueurs sont respectées."]}],"xnotes":{"prog":["Les passifs et le bonus de croissance (B2) ne concernent que le blé, la carotte, la pomme de terre, la betterave et la fleur-torche : pas la plante-amphore, les tiges de pastèque et de citrouille, la verrue du Nether, le cacao ni les baies sucrées."],"xp":["Tes propres cultures comptent : une culture que tu as plantée rapporte son XP une fois mûre, sans délai minimum.","Seules les cultures mûres cassées à la main comptent, pas celles récoltées par une machine ou par l'eau."],"goals":["Une tige de pastèque mûre et la pastèque qu'elle produit sont deux récoltes différentes, chacune avec son bonus de première fois."]}},"mineur":{"id":"mineur","title":"MINEUR","sections":{"GAIN D'XP":["1 XP par bloc de pierre.","5 XP par minerai, sauf : bloc de fer brut 15 XP, minerai d'or 20 XP, minerai de diamant 20 XP, minerai d'émeraude 50 XP, débris antiques 500 XP."],"CHOIX DU MÉTIER":["+10 % de vitesse de minage à l'embauche, puis +1 % par niveau."]},"tiers":[{"lvl":10,"A":"+30 % d'XP Minecraft sur les minerais qui en donnent (charbon, diamant, lapis-lazuli, redstone, émeraude, quartz, or du Nether)","B":"30 % de chance de ne pas user ta pioche en cassant de la pierre","nA":"Rien sur le fer, l'or, le cuivre ni les débris antiques, ni avec Toucher de soie."},{"lvl":30,"A":"+30 % de butin des minerais","B":"Les minerais visibles à proximité scintillent après un minage","nB":"Dans un rayon de 5 blocs, après avoir cassé un minerai ou de la pierre. Les minerais cachés dans la roche ne sont pas révélés."},{"lvl":50,"A":"Commande /surface","B":"Commande /surface","shared":true,"nA":"Te ramène à la surface juste au-dessus de toi. Dans le Nether, juste sous le plafond de bedrock. Si tu devais arriver dans la lave, un bloc de pierre est posé avant. Recharge : 60 s."},{"lvl":75,"A":"Alerte visuelle de lave et de vide à proximité","B":"Alerte visuelle de lave et de vide à proximité","shared":true,"nA":"Une barre en haut de l'écran te prévient quand de la lave ou un trou est proche, et se remplit à mesure que tu t'en approches."},{"lvl":100,"A":"Récupère un spawner avec Toucher de soie, avec un œuf du monstre","B":"Commande /foreuse","nA":"Ne marche que pour toi.","nB":"Avec une pioche en main, chaque bloc miné casse aussi les blocs autour (cube de 3 × 3 × 3). Retape la commande ou lâche la pioche pour l'arrêter."}],"goals":[["Tous les minerais de l'Overworld minés (charbon, cuivre, diamant, émeraude, or, fer, lapis-lazuli, redstone)","5 000 XP","all"],["Tous les minerais du Nether minés (or du Nether, quartz du Nether, débris antiques)","5 000 XP","all"]],"passives":[{"lvl":20,"title":"Fonte","text":"20 % de chance que le minerai brut miné sorte déjà fondu."},{"lvl":40,"title":"Yeux de taupe","text":"Vision nocturne sous la couche 35."},{"lvl":60,"title":"/vein","text":"Active ou désactive le filon sur ta pioche (son infobulle l'indique). Clic droit : un rayon part de la pioche, et s'il touche un minerai, tout le filon du même minerai est récolté.","more":["Le rayon porte à 16 blocs. Le filon va jusqu'à 128 blocs, jamais à travers la pierre.","Comme si tu cassais toi-même : durabilité, enchantements (Fortune, Toucher de soie) et protections d'autres joueurs s'appliquent, tu gagnes l'XP du métier, et l'effet s'arrête si la pioche casse.","Casser un minerai normalement ne déclenche pas le filon. Si le rayon ne touche aucun minerai, le clic droit reste normal (poser une torche, par exemple).","/foreuse ne s'applique pas aux blocs d'un filon."]},{"lvl":90,"title":"/radar","text":"Donne dans le chat le nombre exact de chaque minerai dans ton chunk et les 8 autour, sur 48 blocs de hauteur : ta tranche de 16 blocs et celles juste au-dessus et en dessous.","more":["Recharge : 30 s."]}],"xnotes":{"goals":["Un minerai et sa version en deepslate comptent comme le même minerai pour les bonus."]}},"pecheur":{"id":"pecheur","title":"PÊCHEUR","sections":{"GAIN D'XP":["15 XP par prise à la canne, poisson ou déchet. Un trésor rapporte 5 fois plus : 75 XP.","20 XP par capture au seau : morue, saumon, poisson tropical, poisson-globe, axolotl ou têtard.","15 XP par poisson tué au combat."],"CHOIX DU MÉTIER":["+10 % de vitesse de pêche à l'embauche, puis +1 % par niveau."]},"tiers":[{"lvl":10,"A":"Chance +2 (4,2 % de chance de trésor)","B":"10 % de chance d'obtenir un œuf du poisson capturé au seau","nA":"Fonctionne comme une potion de chance : plus de trésors, moins de déchets."},{"lvl":30,"A":"Chance +3 : presque plus de déchets en eau libre","B":"+15 % de chance d'obtenir un œuf"},{"lvl":50,"A":"Chance +5","B":"+25 % de chance d'obtenir un œuf"},{"lvl":75,"A":"50 % de chance de doubler tes prises","B":"50 % de chance de doubler tes prises","shared":true},{"lvl":100,"A":"Commande /fishegg","B":"Capture au seau les dauphins, tortues, calmars et calmars luisants","nA":"Donne un œuf de têtard, d'axolotl, de poisson-globe, de poisson tropical, de saumon et de morue. Recharge : 24 h.","nB":"Un seau vide sur l'animal donne son œuf et consomme le seau."}],"goals":[["Premier poisson de chaque espèce pêché à la canne","100 XP","first"],["Premier trésor de chaque type pêché (étiquette, selle, arc, canne à pêche, livre enchanté, coquille de nautile)","100 XP","first"],["Première capture au seau de chaque espèce","100 XP","first"],["Premier poisson de chaque espèce tué au combat","100 XP","first"],["Tous les poissons pêchés à la canne (4)","5 000 XP","all"],["Tous les trésors pêchés (6)","5 000 XP","all"],["Toutes les espèces capturées au seau (6)","5 000 XP","all"],["Tous les poissons tués au combat (4)","5 000 XP","all"]],"passives":[{"lvl":20,"title":"Double barque","text":"Un catamaran à fabriquer avec 2 barques : deux coques côte à côte, les coffres (54 cases) dans l'une, toi dans l'autre.","more":["Son apparence peut encore évoluer."]},{"lvl":40,"title":"Canne posée","text":"Pose ta canne sur une dalle en bois à moins de 3 cases de l'eau, jusqu'à 20 à la fois : elle pêche toute seule.","more":["Quand ça mord (1 à 2 secondes), un clic droit récupère la prise, qui va directement dans ton inventaire. Clic droit trop tôt : rien n'a mordu et l'attente repart de zéro, inutile de spammer.","Maj + clic droit : retire la canne, avec un rappel sous le viseur.","Même butin et mêmes bonus qu'à la main. Appât et Chance de la mer n'ont pas d'effet, seule ta chance de Pêcheur compte.","Ne la casse pas : retire-la avec Maj + clic droit, sinon la canne est perdue. Toi seul peux l'utiliser."]},{"lvl":60,"title":"Filet de pêche","text":"Un filet à poser dans l'eau avec son flotteur : il se remplit tout seul.","more":["Fabrication : le filet = 8 fils en anneau (case du milieu vide) ; le flotteur = 1 fil + 1 bloc de fer.","Pose : objet en main, vise la surface de l'eau et fais un clic droit, comme un nénuphar. Le filet remplace un bloc d'eau ; le flotteur se pose sur l'eau. Poser l'un relie automatiquement l'autre à moins de 5 blocs.","Plein en 30 minutes, relevable dès 1 minute : 1 à 5 prises selon le remplissage, avec les bonus habituels. Les prises vont directement dans ton inventaire.","Relevé plein, 10 % de chance qu'un dauphin, une tortue ou un axolotl vivant apparaisse à côté.","Clic droit sur le filet ou son flotteur : relève les prises. Maj + clic droit sur le filet : relève son contenu (si la minute minimale est passée) puis le ramasse ; sur le flotteur : ne ramasse que le flotteur.","3 filets par joueur, mais autant de flotteurs que tu veux. Toi seul peux les utiliser."]},{"lvl":90,"title":"Marche sur l'eau","text":"Tu peux marcher et courir sur l'eau. Accroupis-toi pour plonger."}],"xnotes":{"goals":["Pêcher, capturer au seau et tuer un poisson sont trois actions séparées : chacune a ses propres bonus.","Une canne à pêche ne compte comme trésor que si elle est enchantée.","Le dauphin, la tortue et les calmars (capturés avec B5) rapportent leurs 20 XP, mais ne comptent ni pour la première capture ni pour la collection."],"hire":["Vitesse de pêche : le poisson mord plus vite en moyenne. Le bouchon peut parfois faire un léger saut."]}},"general":{"id":"general","title":"Règles générales","rules":[["Progression des pouvoirs",["Chaque métier a deux voies, A et B, avec un seul pouvoir à choisir à chaque palier (niveaux 10, 30, 50, 75 et 100). Les deux voies avancent chacune à son rythme : après B1, tu peux très bien prendre A1.","Un pouvoir non choisi à un palier reste disponible au palier suivant. Quand tu choisis un pouvoir, sa version suivante devient disponible au palier d'après.","Certains paliers proposent le même pouvoir sur les deux voies : le prendre sur l'une compte pour les deux."]],["Passifs",["Aux niveaux 20, 40, 60 et 90, chaque métier débloque un passif automatiquement, sans rien choisir. Un message dans le chat annonce son nom et sa description.","Deux exceptions : le Bâtisseur a un 5e passif au niveau 100 (Récupérer un bâtiment), et l'Éleveur un second passif au niveau 60 (Filet de capture amélioré).","Les passifs débloqués sont listés dans la carte du métier de l'écran /jobs (touche J), sous les bonus. Ceux que tu n'as pas encore n'y apparaissent pas."]],["Rappel Maj + clic droit",["Quand tu vises une cible sur laquelle un de tes passifs permet un Maj + clic droit, un petit texte « Maj + clic droit : … » s'affiche sous le viseur pendant 3 secondes, puis s'efface. Il réapparaît quand tu vises une autre cible.","Il n'apparaît que si l'action t'est vraiment possible : bon métier, bon niveau, bon objet en main, cible qui t'appartient.","Il couvre la balise (Enchanteur 40), la table d'enchantement avec un objet enchanté (Enchanteur 60) ou un sac (Explorateur 40), tes filets, flotteurs et cannes posées (Pêcheur), et un de tes bâtiments avec le plan vide correspondant (Bâtisseur 100)."]],["Bonus et XP vont ensemble",["Un bonus de métier ne s'applique que sur une action qui rapporte de l'XP de métier. Casser un bloc posé par un joueur ou tuer un monstre de spawner ne déclenche donc aucun bonus de butin."]],["Bonus uniques",["Chaque métier propose des bonus « première fois » (premier élément de chaque type) et des bonus de collection (tout réunir), versés une seule fois.","Quitter un métier remet ces historiques à zéro : en le reprenant, tu pourras les regagner.","Les cadeaux d'embauche (premier plan, couple de vaches, table d'enchantement) ne sont donnés qu'une seule fois, même si tu reprends le métier."]],["Bouton « Objectif »",["Dans l'écran /jobs, le bouton « Objectif » (sous « Quitter » et « Pouvoirs ») montre où tu en es dans les bonus uniques du métier : compteur, récompense, et chaque élément en vert s'il est obtenu, en gris s'il reste à faire.","Si le métier a les deux sortes de bonus, choisis d'abord « First » ou « Complétion ». « Actualiser » recharge la liste.","Le Mineur n'a que des collections et le Bâtisseur que des « première fois ». Pour le Bâtisseur, les blocs déjà posés sont un simple compteur ; les plans et les types de bâtiment sont listés un par un."]],["Obtenir un second métier",["Le pouvoir du niveau 100 du Fermier (vers l'Éleveur) et celui de l'Éleveur (vers le Fermier) permettent de prendre l'autre métier dès le niveau 50, sans la condition de niveau habituelle. Il faut seulement un emplacement de métier libre (3 au maximum)."]]]},"commandes":[{"cmd":"/jobs","job":"general","lvl":1,"need":"Tous les joueurs","text":"Ouvre l'écran des métiers : niveaux, pouvoirs à choisir et bouton « Objectif ».","cd":""},{"cmd":"/jobs leave <métier> confirm","job":"general","lvl":1,"need":"Tous les joueurs","text":"Quitte un métier. Ses bonus uniques sont remis à zéro.","cd":""},{"cmd":"/tpaccept","job":"general","lvl":1,"need":"Tous les joueurs","text":"Accepte la demande de téléportation d'un Explorateur, dans les 60 secondes.","cd":""},{"cmd":"/flat","job":"batisseur","lvl":1,"need":"À l'embauche","text":"Aplanit le terrain autour de toi : 5 cases et 10 blocs de hauteur, puis 10 × 20 au niveau 40 et 20 × 30 au niveau 60. Rapporte 100 XP.","cd":""},{"cmd":"/plans","job":"batisseur","lvl":1,"need":"À l'embauche","text":"Affiche les plans disponibles, officiels et personnalisés, et permet d'en reprendre un exemplaire.","cd":""},{"cmd":"/undo","job":"batisseur","lvl":1,"need":"À l'embauche","text":"Annule ta dernière construction faite avec un plan, et retire l'XP qu'elle a rapportée.","cd":""},{"cmd":"/plans equerre","job":"batisseur","lvl":10,"need":"Pouvoir A1","text":"Redonne une équerre d'architecte si tu as perdu la tienne.","cd":""},{"cmd":"/plans supprimer <nom>","job":"batisseur","lvl":10,"need":"Pouvoir A1","text":"Supprime un de tes plans personnalisés, après confirmation.","cd":""},{"cmd":"/feuilles","job":"bucheron","lvl":50,"need":"Pouvoir A3","text":"Active ou désactive le drop des feuilles quand tu abats un arbre. Le tronc tombe dans tous les cas.","cd":""},{"cmd":"/deforestation","job":"bucheron","lvl":100,"need":"Pouvoir A5","text":"Abat tous les arbres à moins de 16 blocs, jusqu'à 2 000 blocs.","cd":"30 min"},{"cmd":"/woodseed","job":"bucheron","lvl":100,"need":"Pouvoir B5","text":"Donne une pousse de chaque arbre du jeu.","cd":"8 h"},{"cmd":"/fly","job":"chasseur","lvl":60,"need":"Passif du niveau 60","text":"Vole pendant 3 secondes.","cd":"5 min"},{"cmd":"/immun","job":"chasseur","lvl":90,"need":"Passif du niveau 90","text":"Invincibilité de 2 secondes, déclenchée à ton prochain clic droit.","cd":"30 min"},{"cmd":"/whistle","job":"eleveur","lvl":60,"need":"Passif du niveau 60","text":"Fait venir vers toi tes animaux à moins de 32 blocs.","cd":""},{"cmd":"/jobs boost <métier>","job":"eleveur","lvl":100,"need":"Niveau 100","text":"Choisit le métier qui reçoit +20 % d'XP. Modifiable à volonté.","cd":""},{"cmd":"/bottlexp","job":"enchanteur","lvl":30,"need":"Pouvoir B2","text":"Donne une pile de fioles d'expérience.","cd":"8 h"},{"cmd":"/resetpower <métier>","job":"enchanteur","lvl":90,"need":"Passif du niveau 90","text":"Donne un livre spécial ; en le tenant, annule le dernier pouvoir choisi dans ce métier.","cd":"24 h"},{"cmd":"/immortel","job":"enchanteur","lvl":100,"need":"Pouvoir A5","text":"Donne un livre à combiner à l'enclume avec une arme : elle te sauve une fois de la mort.","cd":"48 h"},{"cmd":"/meal","job":"explorateur","lvl":50,"need":"Pouvoir A3","text":"Remplit ta faim et ta saturation.","cd":"30 min"},{"cmd":"/tpa <joueur>","job":"explorateur","lvl":75,"need":"Pouvoir A4 · B4","text":"Demande à te téléporter vers un joueur, qui doit accepter avec /tpaccept.","cd":""},{"cmd":"/treasure","job":"explorateur","lvl":75,"need":"Pouvoir A4 · B4","text":"Indique la structure à butin la plus proche, dans un rayon de 1 000 blocs.","cd":"12 h"},{"cmd":"/compass structure <structure>","job":"explorateur","lvl":90,"need":"Passif du niveau 90","text":"Indique la structure de ce type la plus proche. Le fort (Stronghold) est exclu.","cd":"24 h, commune avec /compass biome"},{"cmd":"/compass biome <biome>","job":"explorateur","lvl":90,"need":"Passif du niveau 90","text":"Indique le biome de ce type le plus proche.","cd":"24 h, commune avec /compass structure"},{"cmd":"/spot","job":"explorateur","lvl":100,"need":"Pouvoir A5 · B5","text":"Enregistre un point de téléportation, oublié au redémarrage du serveur.","cd":""},{"cmd":"/tpspot","job":"explorateur","lvl":100,"need":"Pouvoir A5 · B5","text":"Te téléporte au point enregistré avec /spot.","cd":""},{"cmd":"/moissonneuse","job":"fermier","lvl":90,"need":"Passif du niveau 90","text":"Active ou désactive la récolte et la replantation automatiques des cultures mûres sur ton passage.","cd":""},{"cmd":"/surface","job":"mineur","lvl":50,"need":"Pouvoir A3 · B3","text":"Te ramène à la surface, juste au-dessus de toi.","cd":"60 s"},{"cmd":"/vein","job":"mineur","lvl":60,"need":"Passif du niveau 60","text":"Active ou désactive le filon sur ta pioche : clic droit sur un minerai, tout le filon du même minerai est récolté, jusqu'à 128 blocs.","cd":""},{"cmd":"/radar","job":"mineur","lvl":90,"need":"Passif du niveau 90","text":"Compte chaque minerai dans ton chunk et les 8 chunks autour, sur 48 blocs de hauteur.","cd":"30 s"},{"cmd":"/foreuse","job":"mineur","lvl":100,"need":"Pouvoir B5","text":"Active ou désactive le minage en cube de 3 × 3 × 3, pioche en main.","cd":""},{"cmd":"/fishegg","job":"pecheur","lvl":100,"need":"Pouvoir A5","text":"Donne un œuf de chaque poisson, de têtard et d'axolotl.","cd":"24 h"}]}}</script>

  function cellState(id, branch, version) {
    const sl = slots(id), have = sl.filter(s => s.branch === branch).length;
    const mine = sl.find(s => s.branch === branch && s.version === version);
    if (mine) return { st: "picked", lvl: mine.lvl };
    if (version - 1 > have) return { st: "blocked", why: U.requires(branch + (version - 1)) };
    if (sl.length >= 5) return { st: "blocked", why: U.complete };
    return { st: "next", lvl: TIERS[sl.length] };
  }
  let tech = store.get("prec", true);
  let planFilter = "all";
  let hoverBranch = null;

  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cmdify = s => esc(s).replace(/(^|[\s(«“])(\/[a-z][a-z-]*(?: 'player')?)/gi, '$1<span class="cmd">$2</span>');
  const fmt = n => (Math.round(n * 10) / 10).toLocaleString(U.locale);
  const pk = p => p.key || p.name;               // nom français du plan : clé des aperçus

  function commandsOf(j) {
    const set = new Set();
    const grab = p => { for (const m of p.matchAll(/(?:^|[\s(«“])(\/[a-z][a-z-]*)/gi)) set.add(m[1]); };
    (j.tiers || []).forEach(t => LANES.forEach(k => grab(t[k])));
    (j.passives || []).forEach(q => [q.title, q.text].forEach(grab));
    Object.values(j.sections || {}).flat().forEach(grab);
    (j.custom || []).forEach(([, items]) => items.forEach(grab));
    return [...set].filter(c => c.length > 2);
  }

  /* ---- rendu des blasons ---- */
  function renderTiles() {
    const nav = $("#jobs");
    nav.innerHTML = ORDER.map(id => {
      const m = META[id];
      return `<button class="tile" style="--job:${m.color}" data-job="${id}" aria-current="${id === current}">${icon(id)}<span>${m.name}</span><small>${m.tag}</small></button>`;
    }).join("");
    $("#extra").innerHTML = ["commandes", "general"].map(id => {
      const m = META[id];
      return `<button class="tile mini" style="--job:${m.color}" data-job="${id}" aria-current="${id === current}">${icon(id)}<span>${id === "commandes" ? U.allCmds : U.commonRules}</span></button>`;
    }).join("");
    document.querySelectorAll(".tile").forEach(b => b.addEventListener("click", () => selectJob(b.dataset.job)));
  }

  function selectJob(id) {
    current = id; store.set("job", id);
    $("#q").value = "";
    syncLevel();
    try { history.replaceState(null, "", location.pathname + location.search + "#" + id); } catch (e) {}
    document.documentElement.style.setProperty("--job", META[id].color);
    document.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-current", t.dataset.job === id));
    render();
  }

  /* ---- fiche d'un métier ---- */
  function renderJob(id) {
    const j = DATA[id], m = META[id], s = j.sections;
    const cmds = commandsOf(j);
    let h = `<section class="head">${icon(id)}<div><h2>${m.name}</h2><p>${esc(m.tag)}</p>
      ${cmds.length ? `<div class="chips">${cmds.map(c => `<span class="cmd">${esc(c)}</span>`).join("")}</div>` : ""}</div></section>`;

    // faits clés
    h += `<section class="facts">`;
    h += `<article class="fact"><h3>${U.xpH}</h3>${s["GAIN D'XP"].map(p => `<p>${cmdify(p)}</p>`).join("")}${xn(j, "xp")}</article>`;
    h += `<article class="fact"><h3>${U.hireH}</h3>${s["CHOIX DU MÉTIER"].map(p => `<p>${cmdify(p)}</p>`).join("")}${xn(j, "hire")}</article>`;
    h += progressFact(id);
    h += `</section>`;

    // progression : pouvoirs à choisir et passifs sur une seule frise
    const nPas = (j.passives || []).filter(q => q.lvl <= level).length;
    h += `<section><div class="section-title"><h2>${U.progH}</h2><p>${U.progP(nPas, (j.passives || []).length, level)}</p></div></section>`;
    h += xn(j, "prog", true);
    h += `<div class="tree-wrap"><div class="tree" id="tree"><div class="corner"></div>`;
    LANES.forEach(k => { h += `<div class="colhead ${hoverBranch === k ? "hl" : ""}" data-branch="${k}">${U.path(k)}</div>`; });
    const rows = [...new Set([...j.tiers.map(t => t.lvl), ...(j.passives || []).map(q => q.lvl)])].sort((a, b) => a - b);
    rows.forEach(L => {
      const i = j.tiers.findIndex(t => t.lvl === L), t = j.tiers[i];
      const locked = level < L;
      if (t) {
        h += `<div class="tier ${locked ? "locked" : ""}"><small>${U.tierLvl}</small><b>${L}</b><small>${locked ? U.locked : U.pick}</small></div>`;
        (t.shared ? ["*"] : LANES).forEach(k => {
          const shared = k === "*";
          const code = shared ? `A${i + 1} · B${i + 1}` : k + (i + 1);
          const cs = shared ? sharedState(id, i + 1) : cellState(id, k, i + 1);
          const txt = shared ? t.A : t[k], note = shared ? t.nA : t["n" + k];
          const pat = /patience|ne fait rien/i.test(DATA_ALL.fr[id].tiers[i][shared ? "A" : k]);
          const tag = cs.st === "picked" ? `<span class="tag on">${U.picked(cs.lvl)}</span>`
                    : cs.st === "next" ? `<span class="tag ${level < cs.lvl ? "later" : "go"}">${level < cs.lvl ? U.atLvl(cs.lvl) : U.avail}</span>`
                    : `<span class="tag off">${cs.why}</span>`;
          h += `<button class="pw ${cs.st} ${shared ? "shared" : ""} ${locked ? "locked" : ""} ${pat ? "patience" : ""} ${hoverBranch === k ? "hl" : ""}" data-version="${i + 1}" data-branch="${k}"
            aria-pressed="${cs.st === "picked"}" ${cs.st === "blocked" ? `aria-disabled="true" title="${cs.why}"` : ""}>
            <span class="code">${code}${shared ? U.shared : ""}${tag}</span><span class="txt">${cmdify(txt)}</span>${tech && note ? `<span class="pnote">${cmdify(note)}</span>` : ""}</button>`;
        });
      }
      (j.passives || []).filter(q => q.lvl === L).forEach((q, n) => {
        h += !t && n === 0 ? `<div class="tier auto ${locked ? "locked" : ""}"><small>${U.tierLvl}</small><b>${L}</b><small>${U.pas}</small></div>` : `<div class="sp"></div>`;
        const more = q.more && q.more.length ? (tech ? `<ul>${q.more.map(x => `<li>${cmdify(x)}</li>`).join("")}</ul>` : "") : "";
        h += `<article class="pas row ${locked ? "locked" : ""}"><div class="ph"><span class="kind">${U.pasKind(t ? L : 0)}</span>${locked ? `<span class="pill no">${U.inLv(L - level)}</span>` : `<span class="pill use">${U.active}</span>`}</div>
          <h3>${cmdify(q.title)}</h3><p>${cmdify(q.text)}</p>${more}</article>`;
      });
    });
    h += `</div></div>`;
    h += renderBuild(id);

    if (j.goals && j.goals.length) h += renderGoals(j) + xn(j, "goals", true);


    if (id === "batisseur") h += renderPlanCycle(j);


    if (id === "batisseur") h += renderPlans(j) + xn(j, "plans", true);
    if (j.custom) h += renderCustom(j);

    return h;
  }

  function renderCommands() {
    const groups = ["general", ...ORDER].map(id => {
      const list = DATA.commandes.filter(c => c.job === id);
      if (!list.length) return "";
      const m = META[id];
      return `<section class="cmdgroup" style="--job:${m.color}"><h3>${icon(id)}${id === "general" ? U.cmdAll : `<button class="jlink" data-go="${id}">${m.name}</button>`}</h3>
        <div class="cmdlist">${list.map(c => {
          const lock = c.lvl > level;
          return `<article class="cmdcard ${lock ? "locked" : ""}" style="--job:${m.color}"><div class="ch"><span class="cmd">${esc(c.cmd)}</span>${c.lvl > 1 ? (lock ? `<span class="pill no">${U.lvlShort(c.lvl)}</span>` : `<span class="pill use">${U.lvlShort(c.lvl)}</span>`) : ""}</div>
            <p>${esc(c.text)}</p><span class="cmeta">${esc(c.need)}${c.cd ? ` · ${U.cooldown}${esc(c.cd)}` : ""}</span></article>`;
        }).join("")}</div></section>`;
    }).join("");
    return `<section class="head">${icon("commandes")}<div><h2>${U.cmdHead}</h2><p>${U.cmdIntro}</p></div></section>${groups}`;
  }

  // précisions rattachées à une section (affichées avec la case « Afficher les précisions »)
  function xn(j, key, boxed) {
    const list = (j.xnotes || {})[key];
    if (!tech || !list || !list.length) return "";
    return `<ul class="xnotes ${boxed ? "boxed" : ""}">${list.map(n => `<li>${cmdify(n)}</li>`).join("")}</ul>`;
  }

  function renderGoals(j) {
    const kinds = [["first", U.kFirst, U.kFirstSub], ["all", U.kAll, U.kAllSub]];
    const groups = kinds.map(([k, t, sub]) => {
      const items = j.goals.filter(g => g[2] === k);
      if (!items.length) return "";
      return `<div class="ggroup"><h3>${t} <small>${sub}</small></h3><ul>${items.map(g =>
        `<li class="goal ${k}"><span class="gxp">${esc(g[1])}</span><span class="glabel">${cmdify(g[0])}</span></li>`).join("")}</ul></div>`;
    }).join("");
    return `<section class="goals"><div class="section-title"><h2>${U.goalsH}</h2><p>${U.goalsP}</p></div>${groups}</section>`;
  }

  function progressFact(id) {
    const p = PERLVL[id];
    if (p) {
      const v = p.base + p.inc * level, max = p.base + p.inc * 100, sg = U.pctSign;
      return `<article class="fact"><h3>${esc(U.perAt(PERLVL_LABEL[lang][id], level))}</h3>
        <span class="big">+${fmt(v)}${sg}</span><div class="meter"><i style="width:${(v / max) * 100}%"></i></div>
        <p class="extra">${p.base ? U.perBase(fmt(p.base)) : ""}${U.perInc(fmt(p.inc), fmt(max))}</p></article>`;
    }
    if (id === "enchanteur") {
      return `<article class="fact"><h3>${U.ench}</h3><span class="big">${U.enchBig}</span>
        <p class="extra">${U.enchP(level)}</p></article>`;
    }
    if (id === "batisseur") {
      const plans = DATA.batisseur.plans;
      const use = plans.filter(p => p.use <= level).length, fill = plans.filter(p => p.unlock <= level && p.use > level).length;
      return `<article class="fact"><h3>${U.planAt(level)}</h3><span class="big">${U.planUse(use)}</span>
        <div class="meter"><i style="width:${(use / plans.length) * 100}%"></i></div>
        <p class="extra">${fill ? U.planFill(fill) : ""}${U.planTot(plans.length)}</p></article>`;
    }
    return "";
  }

  function renderCustom(j) {
    const lock = level < 10 ? `<span class="pill no">${U.customFrom}</span>` : `<span class="pill use">${U.customPow}</span>`;
    return `<section><div class="section-title"><h2>${U.customH} ${lock}</h2><p>${U.customP}</p></div>
      <div class="rules custom">${j.custom.map(([t, items]) => `<article><h3>${esc(t)}</h3><ul>${items.map(i => `<li>${cmdify(i)}</li>`).join("")}</ul></article>`).join("")}</div></section>`;
  }

  function renderPlanCycle(j) {
    const s = j.sections;
    const steps = ["CONCEPT DU PLAN", "REMPLISSAGE", "INFOBULLE (CLIENT)", "PLAN PRÊT", "UTILISATION"].map((k, i) => [U.cycle[i], k]);
    return `<section><div class="section-title"><h2>${U.cycleH}</h2><p>${U.cycleP}</p></div></section>
      <div class="flow">${steps.map(([t, k]) => { const ps = s[k] || [];
        return `<div><h3>${t}</h3><p>${cmdify(ps[0] || "")}</p>${ps.length > 1 ? `<details><summary>${U.details}</summary>${ps.slice(1).map(p => `<p>${cmdify(p)}</p>`).join("")}</details>` : ""}</div>`; }).join("")}</div>`;
  }

  const VIEW_KEYS = ["face", "avant", "arriere", "coupe", "coupe2", "capture"];
  const views = () => VIEW_KEYS.map(k => [k, U.views[k]]);
  function visiblePlans() {
    return DATA.batisseur.plans.filter(p => planFilter === "all" || (planFilter === "use" ? p.use <= level : p.unlock <= level));
  }
  function renderPlans(j) {
    const max = Math.max(...j.plans.map(p => p.blocks));
    const cards = visiblePlans().map(p => {
      const st = p.use <= level ? `<span class="pill use">${U.usable}</span>` : p.unlock <= level ? `<span class="pill fill">${U.toFill}</span>` : `<span class="pill no">${U.lvlShort(p.unlock)}</span>`;
      const pv = PREVIEWS[pk(p)];
      const idx = j.plans.indexOf(p);
      const nv = pv ? views().filter(([k]) => pv[k]).length : 0;
      return `<article class="plan">
        <button class="thumb" data-plan="${idx}" ${pv ? "" : "disabled"} aria-label="${pv ? esc(U.seePrev(p.name)) : U.noPrev}">
          ${pv ? `<img src="${(pv.face || pv.capture).src}" alt="${esc((pv.face ? U.face : U.capt) + U.of + p.name)}" loading="lazy" width="${(pv.face || pv.capture).w}" height="${(pv.face || pv.capture).h}">
                 <span class="views">${nv > 1 ? U.nViews(nv) : U.captureW}</span>` : `<span class="noprev">${U.noPrev}</span>`}
        </button>
        <div class="pbody">
          <div class="ptitle"><h3>${esc(p.name)}</h3>${st}</div>
          <div class="plv"><span>${U.unlocked} <b>${p.unlock}</b></span><span>${U.usableL} <b>${p.use}</b></span></div>
          <div class="blocks"><div class="meter"><i style="width:${(p.blocks / max) * 100}%"></i></div><span class="num">${p.blocks.toLocaleString(U.locale)} ${U.blocks}</span></div>
          ${p.extra ? `<p class="extra">${cmdify(p.extra)}</p>` : ""}
        </div></article>`;
    }).join("");
    return `<section><div class="section-title"><h2>${U.plansH}</h2>
      <div class="seg" role="group" aria-label="${U.filterAria}">
        <button data-pf="all" aria-pressed="${planFilter === "all"}">${U.fAll}</button>
        <button data-pf="unlock" aria-pressed="${planFilter === "unlock"}">${U.fUnlock}</button>
        <button data-pf="use" aria-pressed="${planFilter === "use"}">${U.fUse}</button></div></div>
      <p class="hint">${U.plansHint}</p></section>
      ${cards ? `<div class="plans">${cards}</div>` : `<div class="empty-state">${U.plansNone(level)}</div>`}`;
  }

  /* ---- visionneuse d'aperçus ---- */
  let viewer = { plan: -1, view: "face" };
  function openViewer(idx, view) {
    const pv0 = PREVIEWS[pk(DATA.batisseur.plans[idx])]; viewer = { plan: idx, view: view || (pv0.face ? "face" : Object.keys(pv0)[0]) };
    const v = $("#viewer"); v.hidden = false; document.body.style.overflow = "hidden";
    drawViewer(); $("#vClose").focus();
  }
  function closeViewer() {
    const v = $("#viewer"); v.hidden = true; document.body.style.overflow = "";
    const back = $(`.thumb[data-plan="${viewer.plan}"]`); if (back) back.focus({ preventScroll: true });
  }
  function stepViewer(d) {
    const list = DATA.batisseur.plans.map((p, i) => i).filter(i => PREVIEWS[pk(DATA.batisseur.plans[i])]);
    const at = list.indexOf(viewer.plan);
    viewer.plan = list[(at + d + list.length) % list.length];
    const pvs = PREVIEWS[pk(DATA.batisseur.plans[viewer.plan])]; if (!pvs[viewer.view]) viewer.view = pvs.face ? "face" : Object.keys(pvs)[0];
    drawViewer();
  }
  function drawViewer() {
    const p = DATA.batisseur.plans[viewer.plan], pv = PREVIEWS[pk(p)], im = pv[viewer.view];
    const st = p.use <= level ? `<span class="pill use">${U.vUsable(level)}</span>` : p.unlock <= level ? `<span class="pill fill">${U.toFill}</span>` : `<span class="pill no">${U.vUnlockedAt(p.unlock)}</span>`;
    $("#vTitle").textContent = p.name;
    $("#vMeta").innerHTML = `${U.vMeta(p.unlock, p.use, p.blocks.toLocaleString(U.locale))} ${st}`;
    $("#vTabs").innerHTML = views().filter(([k]) => pv[k]).map(([k, l]) =>
      `<button role="tab" aria-selected="${k === viewer.view}" data-v="${k}">${k === "coupe" && pk(p).startsWith("Villa") ? U.sections : l}</button>`).join("");
    $("#vTabs").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { viewer.view = b.dataset.v; drawViewer(); }));
    const stage = $("#vStage");
    stage.className = "vstage " + (viewer.view === "face" ? "is-face" : viewer.view === "capture" ? "is-capture" : "");
    stage.innerHTML = `<img src="${im.src}" alt="${esc(p.name)} : ${viewer.view}" width="${im.w}" height="${im.h}">`;
    stage.scrollTop = 0;
  }
  $("#vClose").addEventListener("click", closeViewer);
  $("#vPrev").addEventListener("click", () => stepViewer(-1));
  $("#vNext").addEventListener("click", () => stepViewer(1));
  $("#viewer").addEventListener("click", e => { if (e.target.id === "viewer") closeViewer(); });
  document.addEventListener("keydown", e => {
    if ($("#viewer").hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight") stepViewer(1);
    else if (e.key === "ArrowLeft") stepViewer(-1);
  });

  function renderBuild(id) {
    const j = DATA[id], sl = slots(id);
    const n = sl.length;
    const items = TIERS.map((lvl, i) => {
      const s = sl[i];
      return s ? `<li><span class="t">${U.lvlShort(lvl)}</span><span class="c">${s.branch}${s.version}</span><span>${cmdify(j.tiers[s.version - 1][s.branch])}</span></li>`
               : `<li class="empty"><span class="t">${U.lvlShort(lvl)}</span><span class="c">·</span><span>${i === n ? U.nextPick : U.notYet}</span></li>`;
    }).join("");
    return `<section class="build" aria-live="polite"><div class="section-title"><h2>${U.buildH(n)}</h2>
      <div class="row"><button class="btn primary" id="copy" ${n ? "" : "disabled"}>${U.copy}</button><button class="btn" id="reset" ${n ? "" : "disabled"}>${U.clear}</button><span class="status" id="status"></span></div></div>
      <ol>${items}</ol></section>`;
  }

  function renderRules() {
    const r = DATA.general.rules;
    return `<section class="head">${icon("general")}<div><h2>${U.rulesH}</h2><p>${U.rulesP}</p></div></section>
      <section class="rules">${r.map(([t, items]) => `<article><h3>${esc(t)}</h3><ul>${items.map(i => `<li>${cmdify(i)}</li>`).join("")}</ul></article>`).join("")}</section>`;
  }

  /* ---- recherche ---- */
  function renderSearch(q) {
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const nq = norm(q.trim());
    const hits = [];
    ORDER.forEach(id => {
      const j = DATA[id];
      j.tiers.forEach((t, i) => (t.shared ? ["A"] : LANES).forEach(k => { const note = t["n" + k] || ""; if (norm(t[k] + " " + note).includes(nq)) hits.push({ id, lvl: t.lvl, code: t.shared ? `A${i + 1} · B${i + 1}` : k + (i + 1), txt: t[k] + (note && norm(note).includes(nq) ? " — " + note : "") }); }));
      Object.values(j.xnotes || {}).flat().forEach(p => { if (norm(p).includes(nq)) hits.push({ id, lvl: null, code: U.hDetail, txt: p }); });
      (j.plans || []).forEach(p => { if (norm(p.name + " " + p.extra).includes(nq)) hits.push({ id, lvl: p.unlock, code: U.hPlan, txt: p.name + (p.extra ? " — " + p.extra : "") }); });
      (j.passives || []).forEach(q => { const t = q.title + " : " + q.text + " " + (q.more || []).join(" "); if (norm(t).includes(nq)) { const m = (q.more || []).filter(x => norm(x).includes(nq)); hits.push({ id, lvl: q.lvl, code: U.hPassive, txt: q.title + " : " + q.text + (m.length ? " — " + m.join(" ") : "") }); } });
      ["GAIN D'XP", "CHOIX DU MÉTIER"].forEach(sec => (j.sections[sec] || []).forEach(p => { if (norm(p).includes(nq)) hits.push({ id, lvl: null, code: sec === "GAIN D'XP" ? U.hXp : U.hHire, txt: p }); }));
      (j.custom || []).forEach(([t, items]) => items.forEach(p => { if (norm(p).includes(nq)) hits.push({ id, lvl: 10, code: U.hCustom, txt: p }); }));
      (j.goals || []).forEach(g => { if (norm(g[0]).includes(nq)) hits.push({ id, lvl: null, code: U.hBonus + g[1], txt: g[0] }); });
    });
    DATA.commandes.forEach(c => { if (norm(c.cmd + " " + c.text + " " + c.need + " " + c.cd).includes(nq)) hits.push({ id: "commandes", lvl: c.lvl > 1 ? c.lvl : null, code: (c.job === "general" ? U.hAll : META[c.job].name) + " · " + c.need, txt: c.cmd + " : " + c.text + (c.cd ? " " + U.cooldownCap + c.cd + "." : "") }); });
    DATA.general.rules.forEach(([t, items]) => items.forEach(p => { if (norm(t + " " + p).includes(nq)) hits.push({ id: "general", lvl: null, code: t, txt: p }); }));
    const mark = s => {
      const n = norm(s); let out = "", i = 0, at;
      while ((at = n.indexOf(nq, i)) !== -1 && nq) { out += esc(s.slice(i, at)) + "<mark>" + esc(s.slice(at, at + nq.length)) + "</mark>"; i = at + nq.length; }
      return out + esc(s.slice(i));
    };
    let h = `<section class="section-title"><h2>${esc(U.resN(hits.length, q.trim()))}</h2><p>${U.resHint}</p></section>`;
    if (!hits.length) return h + `<div class="empty-state">${U.resNone}</div>`;
    h += `<div class="results">${hits.map(x => `<button class="hit" style="--job:${META[x.id].color}" data-go="${x.id}">${icon(x.id)}
      <span><span class="meta">${META[x.id].name} · ${x.code}${x.lvl ? ` · ${U.hLevel} ${x.lvl}` : ""}</span><br><span class="txt">${mark(x.txt)}</span></span>
      ${x.lvl && level < x.lvl ? `<span class="pill no">${U.lvlShort(x.lvl)}</span>` : x.lvl ? `<span class="pill use">${U.hAccess}</span>` : ""}</button>`).join("")}</div>`;
    return h;
  }

  /* ---- rendu principal ---- */
  function render() {
    const main = $("#main"), q = $("#q").value;
    document.documentElement.style.setProperty("--job", META[current].color);
    if (q.trim().length >= 2) main.innerHTML = renderSearch(q);
    else main.innerHTML = current === "general" ? renderRules() : current === "commandes" ? renderCommands() : renderJob(current);
    bind();
  }

  function bind() {
    const main = $("#main");
    main.querySelectorAll(".pw").forEach(b => {
      b.addEventListener("click", () => {
        const v = +b.dataset.version;
        const cs = b.dataset.branch === "*" ? sharedState(current, v) : cellState(current, b.dataset.branch, v);
        const k = cs.branch || b.dataset.branch;
        if (cs.st === "blocked") return;
        let seq = seqOf(current).slice();
        if (cs.st === "picked") {
          // retirer cette version et les versions suivantes de la même voie (elles en dépendent)
          let seen = 0; seq = seq.filter(x => x !== k || ++seen < v);
        } else seq.push(k);
        picks[current] = seq; store.set("picks2", picks); render();
        const again = $(`.pw[data-version="${v}"][data-branch="${b.dataset.branch}"]`); if (again) again.focus({ preventScroll: true });
      });
      b.addEventListener("mouseenter", () => highlight(b.dataset.branch === "*" ? null : b.dataset.branch));
      b.addEventListener("mouseleave", () => highlight(null));
    });
    main.querySelectorAll(".colhead").forEach(c => {
      c.addEventListener("mouseenter", () => highlight(c.dataset.branch));
      c.addEventListener("mouseleave", () => highlight(null));
    });
    main.querySelectorAll("[data-pf]").forEach(b => b.addEventListener("click", () => { planFilter = b.dataset.pf; render(); }));
    main.querySelectorAll(".thumb[data-plan]").forEach(b => b.addEventListener("click", () => openViewer(+b.dataset.plan)));
    main.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => selectJob(b.dataset.go)));
    const copy = $("#copy");
    if (copy) copy.addEventListener("click", () => {
      const j = DATA[current];
      const lines = [`${META[current].name}${lang === "fr" ? " : " : ": "}${U.myPath}`].concat(slots(current).map(s =>
        `${U.lvlC} ${s.lvl} · ${s.branch}${s.version}${lang === "fr" ? " : " : ": "}${j.tiers[s.version - 1][s.branch]}`));
      const text = lines.join("\n"), st = $("#status");
      const done = () => { st.textContent = U.copied; };
      const fail = () => { st.textContent = U.copyFail; };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
    });
    const reset = $("#reset");
    if (reset) reset.addEventListener("click", () => { delete picks[current]; store.set("picks2", picks); render(); });
    main.querySelectorAll("details.notes").forEach(d => d.addEventListener("toggle", () => { tech = d.open; store.set("prec", tech); $("#tech").checked = tech; }));
  }

  function highlight(k) {
    hoverBranch = k;
    document.querySelectorAll(".pw").forEach(p => p.classList.toggle("hl", p.dataset.branch === k));
    document.querySelectorAll(".colhead").forEach(p => p.classList.toggle("hl", p.dataset.branch === k));
  }

  /* ---- réglages ---- */
  const lvl = $("#lvl"), out = $("#lvlOut");
  function showLevel() {
    lvl.value = level; out.textContent = level;
    document.querySelectorAll("#ticks button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.l === level));
    $("#lvlLabel").textContent = ORDER.includes(current) ? U.levelOf(META[current].name) : U.level;
  }
  function syncLevel() {                      // reprend le niveau retenu pour le métier affiché
    if (ORDER.includes(current) && levels[current] >= 1 && levels[current] <= 100) level = levels[current];
    showLevel();
  }
  function setLevel(v) {
    level = Math.max(1, Math.min(100, +v)); store.set("level", level);
    if (ORDER.includes(current)) { levels[current] = level; store.set("levels", levels); }
    showLevel();
    render();
  }
  $("#ticks").innerHTML = MARKS.map(t => `<button data-l="${t}" aria-pressed="false" title="${U.goTo(t)}">${t}</button>`).join("");
  $("#ticks").querySelectorAll("button").forEach(b => b.addEventListener("click", () => setLevel(b.dataset.l)));
  lvl.addEventListener("input", () => setLevel(lvl.value));
  $("#q").addEventListener("input", render);
  $("#barMore").addEventListener("click", e => {
    const open = $(".bar").classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded", open);
    e.currentTarget.textContent = open ? U.barLess : U.barMore;
    if (open) $("#q").focus();
  });
  $("#tech").checked = tech;
  $("#tech").addEventListener("change", e => { tech = e.target.checked; store.set("prec", tech); render(); });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (META[h]) selectJob(h); });

  /* ---- changement de langue ---- */
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = U.docTitle;
    $("#h1").textContent = U.h1; $("#intro").textContent = U.intro; $("#foot").textContent = U.foot;
    $("#techLbl").textContent = U.tech;
    $("#q").placeholder = U.ph; $("#q").setAttribute("aria-label", U.searchAria);
    $("#lvl").setAttribute("aria-label", U.lvlAria);
    $("#barMore").textContent = $(".bar").classList.contains("open") ? U.barLess : U.barMore;
    $("#jobs").setAttribute("aria-label", U.jobsAria); $("#extra").setAttribute("aria-label", U.extraAria);
    $("#vPrev").setAttribute("aria-label", U.prev); $("#vNext").setAttribute("aria-label", U.next);
    $("#vClose").setAttribute("aria-label", U.close); $("#vClose").textContent = U.close;
    $("#langSw").setAttribute("aria-label", U.langAria);
    document.querySelectorAll("#langSw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    document.querySelectorAll("#ticks button").forEach(b => b.title = U.goTo(b.dataset.l));
  }
  function setLang(l, persist) {
    if (!SUPPORTED.includes(l)) return;
    lang = l; DATA = DATA_ALL[l]; U = S[l]; applyMeta();
    if (persist) { try { localStorage.setItem("codex:lang", l); } catch (e) {} }
    try {                                      // garde ?lang=… dans l'adresse (et le #métier)
      const u = new URL(location.href); u.searchParams.set("lang", l);
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) {}
    if (!$("#viewer").hidden) closeViewer();
    applyStatic(); renderTiles(); showLevel(); render();
  }
  document.querySelectorAll("#langSw button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

  applyStatic();
  renderTiles();
  syncLevel();
  render();
})();
</script>


</body>
