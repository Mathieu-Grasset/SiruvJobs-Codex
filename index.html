<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="siruvjobs: XP gains, passives, power trees, plans and commands for every job / gains d'XP, passifs, arbres de pouvoirs, plans et commandes de chaque métier.">
<title>Jobs Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mise en page : établi de pierre. Bandeau de réglages collant, rangée de blasons des métiers, puis la fiche :
   faits clés, arbre de pouvoirs (paliers en lignes, voies A/B/C en colonnes) et parcours choisi. */
:root {
  --bg: #e6e9e3;
  --surface: #f5f6f2;
  --surface-2: #dde2d9;
  --fg: #1d221f;
  --muted: #586159;
  --line: #c3cabf;
  --ink-mix: #000;
  --lock: #6a726c;
  --ok: #2f7d45;
  --warn: #9a6a12;
  --shadow: 0 1px 0 rgba(0,0,0,.06), 0 3px 0 rgba(0,0,0,.05);
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --job: #6b7b70;
  --elev-bg: #d6dee6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1e2125; --surface-2: #2a2e33; --fg: #e6e8e3; --muted: #9ca59e;
    --line: #353a40; --ink-mix: #fff; --lock: #8f9791; --ok: #6cc985; --warn: #e3b153;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 3px 0 rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1e2125; --surface-2: #2a2e33; --fg: #e6e8e3; --muted: #9ca59e;
  --line: #353a40; --ink-mix: #fff; --lock: #8f9791; --ok: #6cc985; --warn: #e3b153;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 3px 0 rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
code, .cmd { font-family: var(--f-mono); font-size: .86em; }
.cmd { background: color-mix(in oklab, var(--job) 16%, var(--surface)); color: var(--job-ink);
  border: 1px solid color-mix(in oklab, var(--job) 35%, transparent); padding: 0 .35em; border-radius: 3px; white-space: nowrap; }
:root, .tile, .hit, .cmdcard { --job-ink: color-mix(in oklab, var(--job), var(--ink-mix) 30%); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in oklab, var(--job) 70%, var(--fg)); outline-offset: 2px; }

/* ---------- en-tête ---------- */
header.top { padding-block: 28px 8px; display: grid; gap: 6px; }
.eyebrow { font: 600 .8rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
header.top h1 { font-size: clamp(2.2rem, 5.5vw, 3.3rem); line-height: 1.05; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.seg.lang button { padding: 5px 11px; font-weight: 700; letter-spacing: .06em; }
header.top p { margin: 0; color: var(--muted); max-width: 62ch; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding-block: 12px; }
.level { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; flex: 1 1 320px; min-width: 0; }
.level label { font-family: var(--f-display); font-size: 1.05rem; white-space: nowrap; }
.level output { display: inline-grid; place-items: center; min-width: 3.2ch; padding: 2px 8px; font: 700 1.1rem var(--f-display);
  background: var(--fg); color: var(--bg); border-radius: 3px; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 120px; accent-color: var(--job); height: 28px; }
.ticks { display: flex; gap: 4px; }
.ticks button { border: 1px solid var(--line); background: var(--surface); padding: 2px 7px; font: 500 .78rem var(--f-mono); border-radius: 3px; cursor: pointer; }
.ticks button[aria-pressed=true] { background: var(--job); color: #fff; border-color: transparent; }
.search { position: relative; flex: 1 1 240px; min-width: 0; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; font: inherit; color: var(--fg); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--job); width: 17px; height: 17px; }

/* ---------- blasons ---------- */
nav.jobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; padding-block: 20px 6px; }
.tile { --job: inherit; display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; background: var(--surface);
  border: 2px solid var(--line); border-radius: 6px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
.tile:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--job) 60%, var(--line)); }
.tile[aria-current=true] { border-color: var(--job); background: color-mix(in oklab, var(--job) 12%, var(--surface)); }
.tile .ico { width: 40px; height: 40px; }
nav.extra { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding-block: 4px 0; }
.tile.mini { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-width: 1px; box-shadow: none; }
.tile.mini .ico { width: 22px; height: 22px; }
.tile.mini span { font: 600 .92rem var(--f-display); }
.tile span { font: 700 1.02rem var(--f-display); }
.tile small { font: .8rem/1.3 var(--f-body); color: var(--muted); text-align: center; }

/* ---------- fiche ---------- */
main { padding-block: 18px 40px; display: grid; gap: 26px; min-width: 0; }
main > * { min-width: 0; }
.head { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.head .ico { width: 76px; height: 76px; padding: 8px; background: color-mix(in oklab, var(--job) 18%, var(--surface)); border: 2px solid var(--job); border-radius: 6px; }
.head h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); color: var(--job-ink); }
.head p { margin: 2px 0 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.fact h3 { font-size: .98rem; color: var(--muted); font-weight: 500; }
.fact p { margin: 0; }
.meter { height: 10px; background: var(--surface-2); border-radius: 2px; overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--job) 0 8px, color-mix(in oklab, var(--job) 75%, var(--ink-mix)) 8px 10px); transition: width .25s; }
.big { font: 700 1.6rem var(--f-display); color: var(--job-ink); font-variant-numeric: tabular-nums; }
.bonus100 { border: 2px dashed var(--job); background: color-mix(in oklab, var(--job) 8%, var(--surface)); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; }
.bonus100 h3 { font-size: 1.05rem; color: var(--job-ink); }
.bonus100 p { margin: 0; }
.bonus100.locked { opacity: .65; }

.section-title { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 1.5rem; }
.section-title p { margin: 0; color: var(--muted); font-size: .92rem; max-width: 60ch; }

.tree-wrap { overflow-x: auto; }
.tree { display: grid; grid-template-columns: 88px repeat(2, minmax(200px, 1fr)); gap: 8px; min-width: 500px; }
.pw.shared { grid-column: span 2; background: color-mix(in oklab, var(--job) 5%, var(--surface)); }
.pw.shared .code::before { content: none; }
.tree .colhead { font: 700 1rem var(--f-display); text-align: center; padding: 6px; border-bottom: 3px solid var(--job); cursor: default; color: var(--job-ink); }
.tree .colhead.hl { background: color-mix(in oklab, var(--job) 14%, transparent); }
.tier { display: grid; place-items: center; align-content: center; gap: 2px; background: var(--surface-2); border-radius: 4px; padding: 8px 4px; }
.tier b { font: 700 1.35rem var(--f-display); font-variant-numeric: tabular-nums; }
.tier small { font: .72rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tier.locked b { color: var(--lock); }
.pw { text-align: left; display: grid; gap: 6px; align-content: start; padding: 10px 12px 12px; background: var(--surface); border: 2px solid var(--line);
  border-radius: 6px; cursor: pointer; position: relative; transition: border-color .12s, background .12s, transform .12s; min-width: 0; }
.pw:hover { border-color: color-mix(in oklab, var(--job) 55%, var(--line)); }
.pw .code { display: flex; justify-content: space-between; align-items: center; font: 600 .82rem var(--f-mono); color: var(--muted); }
.pw .txt { font-size: .93rem; line-height: 1.45; }
.pw.locked { background: color-mix(in oklab, var(--surface) 55%, var(--bg)); }
.pw.locked .txt { color: var(--muted); }
.pw.hl { border-color: color-mix(in oklab, var(--job) 45%, var(--line)); }
.pw[aria-pressed=true] { border-color: var(--job); background: color-mix(in oklab, var(--job) 16%, var(--surface)); transform: translateY(-1px); }
.pw .tag { font-size: .76rem; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.pw .tag.on { background: var(--job); color: #fff; }
.pw .tag.go { color: var(--ok); border: 1px solid color-mix(in oklab, var(--ok) 50%, transparent); }
.pw .tag.later { color: var(--warn); border: 1px solid color-mix(in oklab, var(--warn) 50%, transparent); }
.pw .tag.off { color: var(--lock); }
.pw.next { border-style: dashed; border-color: color-mix(in oklab, var(--job) 60%, var(--line)); }
.pw.blocked { opacity: .72; cursor: not-allowed; }
.pw.blocked:hover { border-color: var(--line); }
.pw.patience .txt { font-style: italic; }
.pw .lock { font-size: .7rem; color: var(--lock); }
.dim { opacity: .45; }

.build { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; }
.build ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.build li { display: grid; grid-template-columns: 64px 46px 1fr; gap: 10px; align-items: baseline; font-size: .93rem; }
.build li .t { font: 600 .8rem var(--f-mono); color: var(--muted); }
.build li .c { font: 700 .95rem var(--f-display); color: var(--job-ink); }
.build li.empty { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: .9rem; }
.btn.primary { background: var(--job); color: #fff; border-color: transparent; }
.btn:hover { filter: brightness(1.06); }
.status { font-size: .85rem; color: var(--ok); }

.passives { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.pas { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--job); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.pas.locked { border-left-color: var(--line); }
.pas.locked h3, .pas.locked p { color: var(--muted); }
.pas .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pas .plvl { font: 700 .84rem var(--f-mono); color: var(--job-ink); }
.pas.locked .plvl { color: var(--lock); }
.pas h3 { font-size: 1.02rem; }
.pas p { margin: 0; font-size: .93rem; }
.pas ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: .86rem; color: var(--muted); }
.pas details summary { cursor: pointer; color: var(--job-ink); font-size: .84rem; }
.pas details ul { margin-top: 6px; }

/* ---------- bonus uniques ---------- */
.goals { display: grid; gap: 12px; }
.ggroup h3 { font-size: 1.05rem; margin-bottom: 8px; }
.ggroup h3 small { font: 500 .78rem var(--f-body); color: var(--muted); margin-left: 6px; }
.ggroup ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.goal { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 12px; min-width: 0; }
.goal .gxp { font: 700 1rem var(--f-display); color: var(--job-ink); white-space: nowrap; font-variant-numeric: tabular-nums;
  background: color-mix(in oklab, var(--job) 14%, var(--surface)); border-radius: 4px; padding: 4px 8px; }
.goal.all { border-color: color-mix(in oklab, var(--job) 45%, var(--line)); }
.goal .glabel { font-size: .9rem; line-height: 1.4; }

/* ---------- plans (Bâtisseur) ---------- */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; counter-reset: st; }
.flow div { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--job); border-radius: 6px; padding: 12px 14px; font-size: .9rem; min-width: 0; }
.flow h3 { font-size: 1rem; margin-bottom: 4px; }
.flow h3::before { counter-increment: st; content: counter(st) " · "; color: var(--job-ink); }
.flow p { margin: 0 0 6px; }
.flow details summary { cursor: pointer; color: var(--job-ink); font-size: .85rem; }
.flow details p { margin-top: 6px; }
.plans-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: .92rem; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 .74rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; font: 600 .78rem var(--f-mono); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.use { background: color-mix(in oklab, var(--ok) 18%, transparent); color: var(--ok); }
.pill.fill { background: color-mix(in oklab, var(--warn) 20%, transparent); color: var(--warn); }
.pill.no { background: var(--surface-2); color: var(--lock); }
.blocks { display: grid; grid-template-columns: 1fr 58px; gap: 8px; align-items: center; min-width: 150px; }
.blocks .meter { height: 8px; }
.extra { color: var(--muted); font-size: .86rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: .88rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--job); color: #fff; }

details.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
details.notes summary { cursor: pointer; padding: 12px 16px; font: 600 1rem var(--f-display); }
details.notes ul { margin: 0; padding: 0 22px 14px 36px; display: grid; gap: 8px; font-size: .9rem; color: var(--muted); max-width: 90ch; }

/* ---------- règles & recherche ---------- */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.rules article { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.rules h3 { font-size: 1.05rem; margin-bottom: 6px; }
.rules.custom article { border-top: 4px solid var(--job); }
.rules.custom ul { font-size: .92rem; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.results { display: grid; gap: 8px; }
.hit { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface);
  border: 1px solid var(--line); border-left: 4px solid var(--job); border-radius: 6px; padding: 10px 14px; cursor: pointer; }
.hit .ico { width: 30px; height: 30px; }
.hit .meta { font: 600 .78rem var(--f-mono); color: var(--muted); }
.hit .txt { font-size: .93rem; }
mark { background: color-mix(in oklab, #f2c94c 55%, transparent); color: inherit; padding: 0 1px; border-radius: 2px; }
.empty-state { color: var(--muted); padding: 24px; text-align: center; border: 2px dashed var(--line); border-radius: 6px; }

footer { border-top: 1px solid var(--line); padding-block: 18px 30px; color: var(--muted); font-size: .85rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
footer .spark { font-family: var(--f-display); color: var(--fg); }


/* ---------- galerie des plans ---------- */
.hint { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.thumb { all: unset; box-sizing: border-box; cursor: pointer; display: grid; place-items: center; aspect-ratio: 4 / 3; width: 100%;
  background: var(--elev-bg); position: relative; border-bottom: 1px solid var(--line); padding: 10px; }
.thumb img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; image-rendering: pixelated; transition: transform .18s; }
.thumb:hover img { transform: scale(1.04); }
.thumb:focus-visible { outline: 3px solid var(--job); outline-offset: -3px; }
.thumb[disabled] { cursor: default; background: var(--surface-2); }
.thumb .views { position: absolute; right: 8px; bottom: 8px; font: 600 .7rem var(--f-mono); background: rgba(20,24,28,.72); color: #fff; padding: 2px 7px; border-radius: 3px; }
.noprev { font: .8rem var(--f-mono); color: var(--muted); }
.pbody { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.ptitle { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.ptitle h3 { font-size: 1.02rem; line-height: 1.25; }
.plv { display: flex; gap: 14px; font-size: .85rem; color: var(--muted); }
.plv b { color: var(--fg); font-variant-numeric: tabular-nums; }
.plan .blocks { grid-template-columns: 1fr auto; min-width: 0; font-size: .85rem; }
.plan .extra { margin: 0; }

.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,14,.72); display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.vbox { background: var(--surface); color: var(--fg); border-radius: 8px; width: min(1180px, 100%); max-height: 100%; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; border: 2px solid var(--job); }
.vhead { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 14px 16px 8px; flex-wrap: wrap; }
.vname { min-width: 0; }
.vname h2 { font-size: 1.4rem; color: var(--job-ink); }
.vname p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vnav { display: flex; gap: 6px; }
.vtabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.vtabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font: 600 .92rem var(--f-display); color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.vtabs button[aria-selected=true] { color: var(--job-ink); border-bottom-color: var(--job); }
.vstage { overflow: auto; display: grid; place-items: center; padding: 14px; min-height: 0; background: #f5f3ee; }
.vstage.is-face { background: var(--elev-bg); }
.vstage img { max-width: 100%; max-height: calc(100vh - 210px); width: auto; height: auto; image-rendering: pixelated; }
.vstage.is-face img { min-width: min(100%, 520px); object-fit: contain; }
.vstage.is-capture img { width: min(100%, 460px); height: auto; image-rendering: auto; }

.btn.more { display: none; }
.xnotes { margin: 0; padding: 8px 0 0 18px; display: grid; gap: 6px; font-size: .86rem; line-height: 1.45; color: var(--muted); border-top: 1px dashed var(--line); }
.xnotes.boxed { padding: 10px 14px 10px 32px; border: 1px dashed var(--line); border-radius: 6px; max-width: 100ch; }
.pnote { font-size: .85rem; line-height: 1.45; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.pas.row { grid-column: span 2; }
.pas .kind { font: 600 .78rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tier.auto { background: none; border: 1px dashed var(--line); }
.cmdgroup { display: grid; gap: 10px; }
.cmdgroup > h3 { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; color: var(--job-ink); }
.cmdgroup > h3 .ico { width: 26px; height: 26px; }
.cmdlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.cmdcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--job); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.cmdcard .ch { display: flex; justify-content: space-between; align-items: start; gap: 8px; flex-wrap: wrap; }
.cmdcard .cmd { font-size: .92rem; white-space: normal; overflow-wrap: anywhere; }
.cmdcard p { margin: 0; font-size: .93rem; }
.cmdcard .cmeta { font-size: .84rem; color: var(--muted); }
.cmdcard.locked p { color: var(--muted); }
.jlink { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.jlink:focus-visible { outline: 3px solid var(--job); outline-offset: 2px; }

@media (max-width: 640px) {
  .btn.more { display: inline-flex; flex: 1 1 100%; justify-content: center; }
  nav.jobs { grid-template-columns: repeat(3, 1fr); gap: 8px; padding-block: 14px 6px; }
  .tile { padding: 8px 4px; gap: 4px; }
  .tile .ico { width: 30px; height: 30px; }
  .tile span { font-size: .9rem; }
  .tile small { display: none; }
  nav.extra { justify-content: stretch; }
  .tile.mini { flex: 1 1 0; justify-content: center; }
  .bar:not(.open) .ticks, .bar:not(.open) .search, .bar:not(.open) .toggle { display: none; }
  .bar .wrap { padding-block: 8px; }
  input[type=range] { min-width: 80px; }
  .tree { grid-template-columns: 1fr; min-width: 0; }
  .tree .corner, .tree .colhead, .tree .sp { display: none; }
  .pw.shared, .pas.row { grid-column: auto; }
  .tier { display: flex; justify-content: flex-start; align-items: baseline; gap: 8px; padding: 6px 10px; margin-top: 8px; }
  .tier b { font-size: 1.15rem; }
  .pw .code .lane { display: inline; }
}
@media (max-width: 560px) {
  .head { grid-template-columns: 1fr; }
  .build li { grid-template-columns: 54px 40px 1fr; }
  .bar .wrap { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="application/json" id="data">{"en":{"batisseur":{"id":"batisseur","title":"BUILDER","sections":{"GAIN D'XP":["100 XP each time you use /flat.","1 XP per block placed, by hand or while building a plan. Some blocks can be worth more.","By hand, a block only pays out once per position: breaking and replacing the same block in the same spot gives nothing, but placing a different block (a renovation) pays out again. Building a plan always gives the XP of every block."],"CHOIX DU MÉTIER":["Gives you the /flat command, which levels the ground within 5 blocks around you, up to 10 blocks high. Destroyed blocks are lost, whatever your level.","Also gives you the first plan, the small cabin: usable from level 2, and you can start filling it right away. It is only given once: leaving and rejoining the job does not give it again."],"CONCEPT DU PLAN":["A plan is an item that remembers the resources already deposited into it. It stays unusable until it is full.","You can store it, move it or trade it: its progress goes with it."],"REMPLISSAGE":["Hold the plan and right-click: it takes everything it is missing from your inventory, in the order of its cost, and never takes more than needed.","Only your inventory is used, not chests or barrels."],"INFOBULLE (CLIENT)":["The plan's tooltip shows each resource with its progress (“Stone: 32/64”) and the total (“Progress: 71%”).","Completed resources are grouped on a single line, and only the first 6 missing resources are listed (“… and N more”).","To see everything, hold the plan and press the “Open jobs” key: every resource appears there with its icon, its progress and an overall bar."],"PLAN PRÊT":["A filled plan changes appearance and gets an enchanted glint."],"UTILISATION":["Hold the plan, left-click a block to anchor the preview, then right-click: a hologram shows the building, which you can rotate with a key. The keys to use are shown above the hotbar.","The preview works even with an incomplete plan, so you can pick the spot in advance; only the confirmation requires a full plan.","After you confirm, the building goes up bit by bit, the plan is consumed and you gain Builder XP."]},"tiers":[{"lvl":10,"A":"Architect's Square: create your own plans. 1 custom plan up to 10 × 10 × 10","B":"85% of the blocks are enough to build a plan (instead of 100%)","nA":"How it all works is described in “Your own plans”, further down.","nB":"Applies to all plans, official and custom alike."},{"lvl":30,"A":"Up to 3 custom plans of 20 × 20 × 20","B":"Remove 1 resource line of your choice from a still-empty plan","nB":"Hold a completely empty plan and press “Open jobs” to remove the line. Once anything has been deposited, this is no longer possible, and a removed line is never refunded."},{"lvl":50,"A":"Up to 3 custom plans of 40 × 40 × 40","B":"65% of the blocks are enough to build a plan"},{"lvl":75,"A":"Up to 5 custom plans of 50 × 40 × 50","B":"Remove up to 3 resource lines from a still-empty plan","nB":"Replaces B2: 3 lines in total, not 3 more."},{"lvl":100,"A":"The square also captures the animals in the area: they reappear when you build the plan","B":"25% of the blocks are enough to build a plan","nA":"20 animals at most. Details in “Your own plans”, further down."}],"plans":[{"name":"Small wooden cabin","unlock":1,"use":2,"blocks":112,"extra":"Glass panes included","key":"Petite cabane en bois"},{"name":"Wooden storeroom","unlock":1,"use":5,"blocks":163,"extra":"Annex of the cabin: 8 chests and 6 storage barrels, barrels included","key":"Réserve en bois"},{"name":"Small Forge","unlock":5,"use":10,"blocks":274,"extra":"Anvil and lava cauldron included","key":"Petite Forge"},{"name":"Statue of Mortar, the Builder's mascot","unlock":10,"use":15,"blocks":1189,"extra":"","key":"Statue de Mortier, mascotte du Bâtisseur"},{"name":"Furnacebelly, guardian of the portal","unlock":15,"use":20,"blocks":1202,"extra":"","key":"Ventre-Fournaise, gardien du portail"},{"name":"Beehive","unlock":20,"use":25,"blocks":1250,"extra":"5 beehives delivered full (15 bees that return to them). Honey-based blocks (honeycombs, honey blocks, beehives, yellow candles) only cost one of each","key":"Ruche"},{"name":"Medieval house","unlock":25,"use":30,"blocks":3112,"extra":"","key":"Maison médiévale"},{"name":"Young Ogrest","unlock":30,"use":35,"blocks":3260,"extra":"","key":"Jeune Ogrest"},{"name":"Netherworld Baths","unlock":35,"use":40,"blocks":3350,"extra":"","key":"Thermes de l'Outre-Monde"},{"name":"Pagoda","unlock":40,"use":45,"blocks":4165,"extra":"","key":"Pagode"},{"name":"Hanging Gardens","unlock":45,"use":50,"blocks":4585,"extra":"Aquatic plants included","key":"Jardins suspendus"},{"name":"Lighthouse and small harbor","unlock":50,"use":55,"blocks":6080,"extra":"Harbor basin dug 3 blocks below the placement point, 2 moored boats, lighthouse beam that rotates as soon as it is built (a button stops or restarts it)","key":"Phare et petit port"},{"name":"Ship","unlock":55,"use":60,"blocks":6200,"extra":"","key":"Navire"},{"name":"Airship","unlock":60,"use":65,"blocks":3500,"extra":"Propellers that spin as soon as it is built","key":"Dirigeable"},{"name":"Botanical greenhouse","unlock":65,"use":70,"blocks":5700,"extra":"2 beehives delivered full (6 bees that return to them)","key":"Serre botanique"},{"name":"Arena","unlock":70,"use":75,"blocks":8150,"extra":"2 gate portcullises and 4 pens that open with buttons","key":"Arène"},{"name":"Cathedral","unlock":75,"use":80,"blocks":19542,"extra":"","key":"Cathédrale"},{"name":"Castle (animated portcullis and drawbridge)","unlock":80,"use":85,"blocks":17426,"extra":"","key":"Château fort (herse et pont-levis animés)"},{"name":"Imperial Temple","unlock":85,"use":90,"blocks":24762,"extra":"","key":"Temple impérial"},{"name":"Seaside villa","unlock":90,"use":95,"blocks":16400,"extra":"Populated as soon as it is built with tropical fish, dolphins, glow squids and turtles, which never despawn; /undo removes them along with the building","key":"Villa de bord de mer"}],"goals":[["First block of each type placed","×10 its XP","first"],["First building of each plan","100 × required level","first"],["First “house” type building","1,000 XP","first"],["First “utility” type building","5,000 XP","first"],["First “decoration” type building","5,000 XP","first"]],"custom":[["Getting the square",["Choosing A1 gives you an “Architect's Square” block. If you lose it, /plans equerre gives you a new one."]],["Outlining your build",["Place the square next to your build and right-click it. Its screen sets the offset (X, Y, Z), the size (X, Y, Z) and the plan's name; a wireframe outline follows your settings live.","“Preview” closes the screen without saving anything, so you can check that the outline fully covers your build. “Draw” creates the plan.","The number of plans and the maximum size depend on your A1 to A4 powers: the highest limit reached applies."]],["What your plan costs",["Every block in the area has to be supplied, even dirt, stone or plants. Only air and water are free.","The calculation follows the rules of the official plans: a door or a bed counts as one, a double slab as two, a wall torch as one torch, a crop as its seed, a flower pot as the pot and its plant. Wood types are interchangeable.","The square is ignored if it is inside the area."]],["Refused captures",["The area contains a block that cannot be obtained in survival: bedrock, spawner, portal, command block… The message states the block and its position.","The area contains blocks from a building made by another player with a plan.","The area exceeds your maximum size, you already have your maximum number of plans, or the name is already used by one of your plans."]],["Animals (A5)",["With A5, the animals in the area (20 at most) are captured with the plan: they disappear without dying, along with their color, age and taming.","They reappear in their place when you build the plan, for free. Without A5, the animals stay where they are.","/undo or a reclaim removes the animals of that build, so that they cannot be duplicated."]],["A plan that belongs only to you",["Only you can fill, preview and build your custom plans.","The plan disappears if you throw it away or if it ends up in another player's inventory. When you die it always disappears, but the resources already deposited are returned to you."]],["Managing your plans",["/plans shows your custom plans in a separate section, where you can take a free empty copy of each one.","/plans supprimer <name> deletes a plan after confirmation, including the copies already in your inventory.","Leaving the job does not delete your plans, but they stay unusable without the job and the A1 power."]],["XP",["Building a custom plan gives the normal XP of each block and the first-block bonus for each type, but never the first-plan bonus or the building-type bonus.","Creating the plan gives no XP."]]],"passives":[{"lvl":20,"title":"Site Clearance","text":"/flat gives 1 XP per natural block destroyed."},{"lvl":40,"title":"Wider Groundwork","text":"/flat now clears 10 blocks around you and 20 blocks up."},{"lvl":60,"title":"Protected Buildings","text":"/flat now clears 20 blocks around you and 30 blocks up, and the blocks of your plan-built buildings resist explosions: only you can break them.","more":["TNT you place explodes normally, but does not destroy your own buildings.","Also applies to buildings built before level 60, and stays active while you are offline.","Buildings placed any other way than with a plan are not protected."]},{"lvl":90,"title":"Instant Site Prep","text":"If a plan's area is not clear, a dedicated key flattens it and then builds, instead of refusing the placement.","more":["Blocks destroyed this way give neither XP nor items.","If the area contains a chest or another block with contents, nothing is destroyed and the placement is refused.","A build that flattened something can no longer be undone with /undo. On an area that is already clear, the key builds normally and /undo stays possible."]},{"lvl":100,"title":"Reclaim a Building","text":"Put a building made from a plan back into a matching empty plan (official or custom): the building is taken apart and the plan fills up.","more":["Simple right-click: shows the percentage that can be reclaimed. Shift + right-click: starts the reclaim.","Only the Builder who built the building can reclaim it. A damaged or modified building is partly reclaimed.","No XP is given. A plan filled this way can no longer be emptied to take the resources back, but it can be used to rebuild normally.","For an official plan, 95% reclaimed counts as a full plan. Creatures that appeared when it was built are removed."]}],"xnotes":{"goals":["First-plan bonus: for example 1,000 XP the first time you build a plan that requires level 10. Rebuilding the same plan does not give it again.","First-block, first-plan and building-type bonuses stack on a single build. A building with several types stacks their bonuses."],"xp":["/undo removes the building and the XP it gave you, bonuses included; you can earn those bonuses again by rebuilding it."],"plans":["Some blocks of a plan are included for free: they are built but do not appear in its cost (for example the cabin's glass panes, the storeroom's barrels, the forge's anvil and lava cauldron, the aquatic plants)."]}},"bucheron":{"id":"bucheron","title":"LUMBERJACK","sections":{"GAIN D'XP":["4 XP per wood block cut.","25 XP when a sapling you planted grows into a tree, whether it grows on its own, with bone meal or thanks to the level 90 passive. You have to be online at that moment."],"CHOIX DU MÉTIER":["+10% logging speed when you take the job, then +1% per level."]},"tiers":[{"lvl":10,"A":"A sapling regrows automatically after felling","B":"20% chance to double the cut wood","nA":"The replanted sapling matches the wood type that was cut. Nether woods have no sapling and do not regrow."},{"lvl":30,"A":"Cutting the base of a trunk brings the whole trunk down","B":"Climb trunks like a ladder","nA":"Every log that falls gives its XP, not just the one you cut.","nB":"Push against a trunk to climb."},{"lvl":50,"A":"The trunk falls, and the leaves of the felled tree fall too (as with Silk Touch). /feuilles turns this leaf drop on or off","B":"No fall damage when landing on a leaf block attached to a trunk","nA":"The trunk keeps falling either way, whether the leaf drop is on or off."},{"lvl":75,"A":"Cutting any block of the trunk brings down the whole tree, branches included","B":"Planting a tree: 5% chance that an animal appears once it has grown","nA":"Follows the branches in every direction, up to 256 blocks. Two touching trees can fall together.","nB":"A rabbit for an oak, a fox for a spruce, a parrot for a jungle tree; other wood types spawn nothing. The animal is wild and can despawn like any other."},{"lvl":100,"A":"/deforestation command","B":"/woodseed command","nA":"Fells every tree within 16 blocks, up to 2,000 blocks per use. Cooldown: 30 min.","nB":"Gives you a sapling of every tree in the game. Cooldown: 8 h."}],"goals":[["First log of each wood type cut","100 XP","first"],["First sapling of each wood type planted","100 XP","first"],["All Overworld wood types cut (10)","10,000 XP","all"],["All saplings planted (12, including both azaleas)","10,000 XP","all"]],"passives":[{"lvl":20,"title":"Bark stripper","text":"Stripping a tree gives as much XP as cutting it."},{"lvl":40,"title":"Foraging","text":"10% chance to find food while cutting wood: melon slice in the jungle, sweet berries in the taiga, an apple elsewhere.","more":["With B1, this food can also be doubled."]},{"lvl":60,"title":"Honed axe","text":"Your axe hits like a sword of the same material: same damage, same attack speed.","more":["Efficiency counts as Sharpness for damage: the higher of the two applies, never the sum."]},{"lvl":90,"title":"Green thumb","text":"A sapling you plant grows by itself after about 5 seconds.","more":["The delay gives you time to plant 4 saplings for big trees (dark oak, jungle…).","Digging up the sapling before the delay ends cancels the automatic growth."]}],"xnotes":{"goals":["Nether woods (crimson and warped) give normal XP and the first-wood-type bonus, but do not count toward the 10-wood-types bonus."]}},"chasseur":{"id":"chasseur","title":"HUNTER","sections":{"GAIN D'XP":["15 XP per monster killed.","8 XP per animal or passive creature killed."],"CHOIX DU MÉTIER":["+10% job XP on monsters and animals when you take the job, then +1% per level.","5% chance of a rare drop on every kill: one time in two an experience bottle, otherwise an emerald, a diamond, a saddle or a name tag."]},"tiers":[{"lvl":10,"A":"+10% damage against monsters","B":"25% chance to double the loot"},{"lvl":30,"A":"+20% attack speed: your hits get back to full power faster","B":"Doubles the rare-drop chance (10%)"},{"lvl":50,"A":"Combine two normally incompatible enchantments at the anvil","B":"Combine two normally incompatible enchantments at the anvil","shared":true,"nA":"For example Sharpness with Bane of Arthropods, or Protection with Blast Protection. Does not work at the enchanting table."},{"lvl":75,"A":"Doubles the Minecraft XP (orbs) of the monsters you kill","B":"Doubles the Minecraft XP (orbs) of the monsters you kill","shared":true,"nA":"Not on animals. Job XP does not change."},{"lvl":100,"A":"Doubles bow damage","B":"50% chance of a rare drop on every kill","nB":"Replaces the 10% of B2."}],"goals":[["First monster or animal of each species killed","100 XP","first"],["All Overworld species killed (69)","10,000 XP","all"],["All animal species killed","5,000 XP","all"],["All Nether species killed (10)","5,000 XP","all"],["All End species killed (4)","5,000 XP","all"]],"passives":[{"lvl":20,"title":"Antidote","text":"You become immune to poison.","more":["Instant damage potions still hurt."]},{"lvl":40,"title":"Armored Skin","text":"You become immune to creeper explosions."},{"lvl":60,"title":"/fly","text":"Fly for 3 seconds.","more":["Cooldown: 5 min, counted from the moment you type the command."]},{"lvl":90,"title":"/immun","text":"2 seconds of invincibility, triggered on your next right-click, even in the void.","more":["Cooldown: 30 min, counted from the moment you type the command."]}],"xnotes":{"xp":["For a kill to give XP or a bonus, you must have dealt at least half of the damage yourself. Rare drops follow the same rules."],"goals":["Overworld: every species you meet outside the Nether and the End, including fish, squids, dolphins and bats.","Nether: blaze, ghast, hoglin, magma cube, piglin, piglin brute, strider, wither skeleton, zoglin, zombified piglin.","End: Ender Dragon, enderman, endermite, shulker. The enderman and the endermite also count for the Overworld.","A killed animal counts both for the animals bonus and for the Overworld bonus."]}},"eleveur":{"id":"eleveur","title":"BREEDER","sections":{"GAIN D'XP":["XP for every birth you cause and every animal you tame, depending on the species' rarity: 25, 50 or 100 XP.","15 XP per egg collected, milk gathered, sheep sheared, or honey harvested from a full beehive (bottle or honeycombs)."],"CHOIX DU MÉTIER":["Gives you a pair of cows, which belong to you. It is only given once: leaving and rejoining the job does not give it again.","Each level increases job XP by 1%. At level 100, a job of your choice gets +20% XP with /jobs boost <job>."]},"tiers":[{"lvl":10,"A":"20% chance to get an extra wool or egg, and to keep your bucket empty when milking","B":"Your animals stop fleeing sooner after being hit","nA":"The extra wool only applies to sheep."},{"lvl":30,"A":"25% chance of twins, with the XP that goes with it","B":"Babies grow 30% faster within 32 blocks of you","nA":"The second baby is the same species, but not necessarily the same color or markings. Does not apply to turtles.","nB":"Does not apply to frogs."},{"lvl":50,"A":"50% chance not to consume the food when feeding an animal","B":"Growing up gives 25 more XP (40 XP in total)","nA":"A fed animal can breed again right away: this power makes your food stock last.","nB":"Without this power, each of your animals that grows up already gives 15 XP. Does not apply to frogs."},{"lvl":75,"A":"Your newborns always have +10% speed","B":"Feeding an animal fully heals it","nB":"Works even if the animal does not breed, for example a baby."},{"lvl":100,"A":"Lets you take the Farmer job from level 50 (you need a free job slot)","B":"Lets you take the Farmer job from level 50 (you need a free job slot)","shared":true}],"goals":[["First birth or first taming of each species","×10 the XP","first"],["All species bred, except the sniffer (the parrot counts through taming)","5,000 XP","all"]],"passives":[{"lvl":20,"title":"Capture Net","text":"A craftable item (1 egg + 1 lead): right-click one of your animals to take it away, right-click elsewhere to release it.","more":["The animal is kept as it is, without dying.","You can always release an animal, even if you changed jobs in the meantime."]},{"lvl":40,"title":"Protective Instinct","text":"Your animals no longer take fall or drowning damage.","more":["Only while you are online."]},{"lvl":60,"title":"/whistle","text":"Calls your animals within 32 blocks to you."},{"lvl":60,"title":"Improved Capture Net","text":"The net also captures creatures that belong to nobody: animals (cow, wolf, horse, axolotl…) and aquatic creatures (fish, squids, dolphins, tadpoles).","more":["A creature that belongs to another player is always refused.","Once released, the creature belongs to you (/whistle, Protective Instinct…), and an aquatic creature no longer despawns on its own.","A net that captured a wild creature is single-use: it is destroyed when you release it. Capturing then releasing your own animals always gives the net back empty."]},{"lvl":90,"title":"Guardian's Stick","text":"One click on any animal makes it invulnerable, a second click cancels it.","more":["The stick cannot be thrown away and returns to your inventory when you die."]}],"xnotes":{"xp":["Your animals: those born from a breeding you triggered, and those you tamed. Wild animals and other players' animals never count.","Rarity: common 25 XP (cow, pig, chicken, sheep, rabbit, turtle), uncommon 50 XP (horse, donkey, mule, llama, wolf, cat, parrot, fox, goat, bee), rare 100 XP (panda, axolotl, strider, hoglin, frog, camel, armadillo). Animals to tame: horse, donkey, mule, llama, wolf, cat, parrot.","The sniffer gives no birth XP.","Turtles: babies that hatch from eggs laid after a breeding you triggered give you the XP and become your animals. You have to be online when they hatch.","Frogs: the XP comes when a tadpole from a breeding you triggered becomes a frog. A tadpole put in a bucket and then released is no longer counted as yours.","An egg that has been thrown gives no XP when picked up: only eggs laid by a chicken count."]}},"enchanteur":{"id":"enchanteur","title":"ENCHANTER","sections":{"GAIN D'XP":["Enchanting table: 1 XP per enchantment level applied, +10 XP if the item is a book, all doubled (×2).","Anvil: 1 XP per enchantment level gained, multiplied by 5.","10 XP per book crafted, with no limit.","20 XP for each of your first 100 bookshelves crafted, and 50 XP for each of your first 10 enchanting tables."],"CHOIX DU MÉTIER":["Gives you an enchanting table, only once: leaving and rejoining the job does not give it again.","Every level gives 1 book and 10 experience bottles."]},"tiers":[{"lvl":10,"A":"10% chance to also get a “treasure” enchantment (Mending, Frost Walker), normally impossible at the table","B":"Saves 25% of the XP spent at the anvil","nA":"The treasure enchantment is added to the table's normal enchantment and is always compatible with the item. Its level follows that of the enchantments applied.","nB":"Reduces the levels actually removed, but you still need the displayed cost to confirm."},{"lvl":30,"A":"The chance stays at 10%, but Soul Speed and Swift Sneak are added to the list","B":"/bottlexp command","nB":"Gives you a stack of experience bottles. Cooldown: 8 h."},{"lvl":50,"A":"+15% chance (25% in total), and Wind Burst is added to the list","B":"Passive Minecraft XP regeneration: 5 points every 10 seconds, about 1,800 per hour"},{"lvl":75,"A":"3% chance that an enchantment applied at the table exceeds its maximum level of 1 (e.g. Protection V)","B":"50% chance that an enchanted item does not lose durability","nA":"The upgraded enchantment is not visible before you confirm; a chat message tells you when it happens. These cannot be upgraded: Infinity, Mending, Silk Touch, Flame, Channeling and the curses, because one more level would change nothing."},{"lvl":100,"A":"/immortel command","B":"50% chance of spending neither XP nor lapis lazuli at the table","nA":"Gives a book to combine at the anvil with a weapon (1 XP level). Hold the weapon in your hand: when a blow would kill you, you come back with 50% of your HP; the weapon loses the enchantment but is not damaged. Cooldown: 48 h."}],"goals":[["First enchanted item of each type (book, sword, pickaxe, axe, shovel, hoe, helmet, chestplate, leggings, boots, fishing rod, bow, crossbow, trident, mace, shield)","100 XP","first"],["First Protection IV, Sharpness IV, Fortune III, Efficiency IV, Infinity, Mending, Silk Touch","1,000 XP each","first"],["All tools enchanted (pickaxe, axe, shovel, hoe), whatever the material","2,000 XP","all"],["All armor pieces enchanted (helmet, chestplate, leggings, boots)","2,000 XP","all"],["All weapons enchanted (sword, bow, crossbow, trident, mace; the shield does not count)","2,000 XP","all"]],"passives":[{"lvl":20,"title":"Arcane Mastery","text":"+50% job XP, on top of the table and anvil multipliers."},{"lvl":40,"title":"Improved Beacon","text":"Shift + right-click on a beacon opens a screen that upgrades it permanently, for free.","more":["Range doubled compared with what its pyramid gives.","A 3rd power of your choice: a missing effect, or the next level of an effect already present.","Benefits every player nearby, even when you are away."]},{"lvl":60,"title":"Disenchanter","text":"Hold an enchanted item and Shift + right-click the table: it is turned into an enchanted book.","more":["Once every 8 hours. A normal click opens the table as usual."]},{"lvl":90,"title":"/resetpower","text":"Gives a special book: hold it and type /resetpower <job> to cancel the last power chosen in that job.","more":["Cooldown: 24 h."]}],"xnotes":{"hire":["At the table, only 1 to 3 levels are actually removed depending on the button chosen; the large number displayed is the minimum level required. The anvil removes its whole cost."],"goals":["The ×2 (table) and ×5 (anvil) multipliers and the level 20 passive do not apply to one-time bonuses."],"xp":["Renaming an item at the anvil gives no XP."]}},"explorateur":{"id":"explorateur","title":"EXPLORER","sections":{"GAIN D'XP":["XP based on the distance traveled: on foot, swimming, by boat or on a mount (horse, donkey, mule, llama, camel, saddled pig or strider).","100 XP when you are the first player to open a generated loot chest."],"CHOIX DU MÉTIER":["+10% speed when you take the job, then +0.5% per level."]},"tiers":[{"lvl":10,"A":"Reduced hunger while traveling: 25% of the cost of sprinting, swimming and jumping refunded","B":"−25% fall damage","nA":"Walking already costs nothing."},{"lvl":30,"A":"No hunger loss in deserts and snowy biomes","B":"Falling 25% slower","nB":"Slows the fall itself, which also reduces the damage on landing a little."},{"lvl":50,"A":"/meal command","B":"Air underwater runs out half as fast","nA":"Fills your hunger and saturation. Cooldown: 30 min."},{"lvl":75,"A":"/tpa <player> and /treasure commands","B":"/tpa <player> and /treasure commands","shared":true,"nA":"/tpa <player>: asks to teleport to that player, who must accept with /tpaccept within 60 seconds. /treasure: points to the nearest loot structure within 1,000 blocks, like a treasure map; the loot may already have been taken. Cooldown: 12 h."},{"lvl":100,"A":"/spot and /tpspot commands","B":"/spot and /tpspot commands","shared":true,"nA":"/spot saves a point, /tpspot takes you back to it. The point is forgotten when the server restarts."}],"goals":[["First discovery of each biome","100 XP","first"],["First discovery of each structure type (village, temple, dungeon…)","1,000 XP","first"],["All Overworld biomes discovered","5,000 XP","all"],["All Nether biomes discovered","5,000 XP","all"],["All End biomes discovered","5,000 XP","all"],["All Overworld structures discovered","5,000 XP","all"],["All Nether structures discovered","5,000 XP","all"],["All End structures discovered","5,000 XP","all"]],"passives":[{"lvl":20,"title":"Cartographer's Memory","text":"The “Goals” button of /jobs shows, for every biome and structure discovered, the coordinates of where you first met it.","more":["Biome: your position when you discovered it. Structure: its center.","The list itself, without coordinates, is visible from the start.","Positions are recorded from the moment you take the job: only viewing them waits for level 20. They are erased if you leave the job."]},{"lvl":40,"title":"Bundle Enchanter","text":"Hold a bag and Shift + right-click an enchanting table: 6 upgrades are offered to you in the chat.","more":["Compartments I, II or III: the bag becomes a small chest of 3, 5 or 10 slots, each a normal stack.","Expanded Capacity I, II or III: the bag holds 2, 3 or 5 times more.","Cost: 1 lapis + 5 levels, then 2 + 15, then 3 + 30.","The two upgrades cannot be combined; changing type requires an empty bag. Going up a level within the same type keeps the contents.","The bag loses its color and its name, and a grindstone cannot disenchant it. On an Expanded Capacity bag, holding right-click to empty it does not work: use drag and drop."]},{"lvl":60,"title":"Water Walker","text":"You can walk and run on water. Crouch to dive."},{"lvl":90,"title":"/compass","text":"/compass structure <structure> or /compass biome <biome> points to the nearest structure or biome.","more":["Cooldown: 24 h, shared by both.","The stronghold cannot be located: you always have to go through eyes of ender. A refusal does not use up the cooldown."]}],"xnotes":{"xp":["Distance traveled: only the real distance counts. Back-and-forth movement, teleports, minecart rides, flying and spectator mode give nothing.","In a boat, you have to paddle: a boat pushed by the current gives nothing.","Suspicious sand does not count as a loot chest."],"goals":["Some variants count as a single structure type: shipwrecks (including beached ones), ocean ruins (cold and warm), mineshafts (including badlands), Overworld ruined portals and abandoned camps. The 5 villages stay distinct, and the Nether ruined portal is a type of its own."]}},"fermier":{"id":"fermier","title":"FARMER","sections":{"GAIN D'XP":["Mature crops (wheat, carrot, potato, beetroot, melon and pumpkin stems, torchflower, pitcher plant): 5 XP.","Melon and pumpkin: 5 XP. Sweet berries harvested: 5 XP.","Mature Nether wart and cocoa: 8 XP.","Sugar cane, cactus and bamboo: 3 XP per block of the stalk (breaking the base pays for the whole stalk). Kelp: 3 XP per block broken."],"CHOIX DU MÉTIER":["10% chance to save the planted resource when you take the job, then +0.5% per level. It is given back to you when you harvest a mature crop."]},"tiers":[{"lvl":10,"A":"You no longer trample farmland, and neither does your mount","B":"3% chance of getting an extra rare resource when harvesting","nB":"Golden carrot, glistering melon slice or golden apple."},{"lvl":30,"A":"Doubles job XP","B":"+50% crop growth speed within 32 blocks of you","nB":"Several Farmers nearby do not stack: the best bonus applies."},{"lvl":50,"A":"Does nothing","B":"Doubles the amount harvested","nA":"A waiting tier before A4."},{"lvl":75,"A":"Directly grants the effects of B1, B2 and B3","B":"Harvests stack up to 99, chests included"},{"lvl":100,"A":"Lets you take the Breeder job from level 50 (you need a free job slot)","B":"Lets you take the Breeder job from level 50 (you need a free job slot)","shared":true}],"goals":[["First harvest of each crop or plant","100 XP","first"],["All crops harvested (wheat, carrot, potato, beetroot, melon stem, pumpkin stem, torchflower, pitcher plant, Nether wart, cocoa)","5,000 XP","all"],["All other plants harvested (melon, pumpkin, sugar cane, sweet berries, cactus, bamboo, kelp)","5,000 XP","all"]],"passives":[{"lvl":20,"title":"Enchanted hoe","text":"Shift + right-click with a hoe: the targeted chunk stays loaded, even when you are far away.","more":["Doing it again elsewhere moves the loaded chunk."]},{"lvl":40,"title":"Sowing hand","text":"The seed of the harvested crop is replanted automatically."},{"lvl":60,"title":"Delicate harvest","text":"Right-click a crop that is not yet mature: you harvest a share of the yield depending on its growth, without destroying the plant.","more":["For example ~57% of the yield at 4/7 growth. Only once before the next normal harvest.","Works with an empty hand or any item, unless you are crouching."]},{"lvl":90,"title":"/moissonneuse","text":"Turns on or off the automatic harvesting and replanting of mature crops you walk or run over.","more":["It breaks as if you did it yourself: the level 40 replanting applies and other players' protected areas are respected."]}],"xnotes":{"prog":["The passives and the growth bonus (B2) only apply to wheat, carrots, potatoes, beetroot and torchflower: not the pitcher plant, melon and pumpkin stems, Nether wart, cocoa or sweet berries."],"xp":["Your own crops count: a crop you planted gives its XP once mature, with no minimum delay.","Only mature crops broken by hand count, not those harvested by a machine or by water."],"goals":["A mature melon stem and the melon it produces are two different harvests, each with its own first-time bonus."]}},"mineur":{"id":"mineur","title":"MINER","sections":{"GAIN D'XP":["1 XP per stone block.","5 XP per ore, except: raw iron block 15 XP, gold ore 20 XP, diamond ore 20 XP, emerald ore 50 XP, ancient debris 500 XP."],"CHOIX DU MÉTIER":["+10% mining speed when you take the job, then +1% per level."]},"tiers":[{"lvl":10,"A":"+30% Minecraft XP on ores that give some (coal, diamond, lapis lazuli, redstone, emerald, quartz, Nether gold)","B":"30% chance not to wear down your pickaxe when breaking stone","nA":"Nothing on iron, gold, copper or ancient debris, nor with Silk Touch."},{"lvl":30,"A":"+30% ore drops","B":"Visible ores nearby sparkle after you mine","nB":"Within a 5-block radius, after breaking an ore or stone. Ores hidden inside the rock are not revealed."},{"lvl":50,"A":"/surface command","B":"/surface command","shared":true,"nA":"Takes you back to the surface just above you. In the Nether, just under the bedrock ceiling. If you would arrive in lava, a stone block is placed first. Cooldown: 60 s."},{"lvl":75,"A":"Visual alert for nearby lava and void","B":"Visual alert for nearby lava and void","shared":true,"nA":"A bar at the top of the screen warns you when lava or a hole is close, and fills up as you get closer."},{"lvl":100,"A":"Recover a spawner with Silk Touch, using an egg of the monster","B":"/foreuse command","nA":"Only works for you.","nB":"With a pickaxe in hand, every block mined also breaks the blocks around it (3 × 3 × 3 cube). Type the command again or drop the pickaxe to stop it."}],"goals":[["All Overworld ores mined (coal, copper, diamond, emerald, gold, iron, lapis lazuli, redstone)","5,000 XP","all"],["All Nether ores mined (Nether gold, Nether quartz, ancient debris)","5,000 XP","all"]],"passives":[{"lvl":20,"title":"Inner furnace","text":"20% chance that the raw ore you mine comes out already smelted."},{"lvl":40,"title":"Miner's eye","text":"Night vision below layer 35."},{"lvl":60,"title":"/vein","text":"Turns the vein miner on or off on your pickaxe (its tooltip shows it). Right-click: a beam leaves the pickaxe, and if it hits an ore, the whole vein of the same ore is harvested.","more":["The beam reaches 16 blocks. The vein goes up to 128 blocks, never through stone.","As if you broke it yourself: durability, enchantments (Fortune, Silk Touch) and other players' protections apply, you gain job XP, and the effect stops if the pickaxe breaks.","Breaking an ore normally does not trigger the vein. If the beam hits no ore, the right-click stays normal (placing a torch, for example).","/foreuse does not apply to the blocks of a vein."]},{"lvl":90,"title":"/radar","text":"Gives in the chat the exact number of each ore in your chunk and the 8 around it, over 48 blocks in height: your 16-block slice and the ones just above and below.","more":["Cooldown: 30 s."]}],"xnotes":{"goals":["An ore and its deepslate version count as the same ore for the bonuses."]}},"pecheur":{"id":"pecheur","title":"FISHER","sections":{"GAIN D'XP":["15 XP per catch with a rod, fish or junk. A treasure pays 5 times more: 75 XP.","20 XP per bucket capture: cod, salmon, tropical fish, pufferfish, axolotl or tadpole.","15 XP per fish killed in combat."],"CHOIX DU MÉTIER":["+10% fishing speed when you take the job, then +1% per level."]},"tiers":[{"lvl":10,"A":"Luck +2 (4.2% treasure chance)","B":"10% chance to get an egg of the fish captured in a bucket","nA":"Works like a luck potion: more treasure, less junk."},{"lvl":30,"A":"Luck +3: almost no more junk in open water","B":"+15% chance of getting an egg"},{"lvl":50,"A":"Luck +5","B":"+25% chance of getting an egg"},{"lvl":75,"A":"50% chance to double your catches","B":"50% chance to double your catches","shared":true},{"lvl":100,"A":"/fishegg command","B":"Bucket-capture dolphins, turtles, squids and glow squids","nA":"Gives a tadpole, axolotl, pufferfish, tropical fish, salmon and cod egg. Cooldown: 24 h.","nB":"An empty bucket on the animal gives its egg and consumes the bucket."}],"goals":[["First fish of each species caught with a rod","100 XP","first"],["First treasure of each type fished (name tag, saddle, bow, fishing rod, enchanted book, nautilus shell)","100 XP","first"],["First bucket capture of each species","100 XP","first"],["First fish of each species killed in combat","100 XP","first"],["All fish caught with a rod (4)","5,000 XP","all"],["All treasures fished (6)","5,000 XP","all"],["All species captured with a bucket (6)","5,000 XP","all"],["All fish killed in combat (4)","5,000 XP","all"]],"passives":[{"lvl":20,"title":"Double boat","text":"A catamaran crafted from 2 boats: two hulls side by side, the chests (54 slots) in one, you in the other.","more":["Its appearance may still change."]},{"lvl":40,"title":"Placed rod","text":"Place your rod on a wooden slab within 3 blocks of water, up to 20 at a time: it fishes by itself.","more":["When something bites (1 to 2 seconds), a right-click collects the catch, which goes straight into your inventory. Right-click too early: nothing has bitten and the wait starts over from zero, so no need to spam.","Shift + right-click: removes the rod, with a reminder under the crosshair.","Same loot and same bonuses as by hand. Lure and Luck of the Sea have no effect, only your Fisher luck counts.","Do not break it: remove it with Shift + right-click, otherwise the rod is lost. Only you can use it."]},{"lvl":60,"title":"Fishing net","text":"A net to place in the water with its float: it fills up by itself.","more":["Crafting: the net = 8 string in a ring (middle slot empty); the float = 1 string + 1 iron block.","Placing: item in hand, aim at the water surface and right-click, like a lily pad. The net replaces a water block; the float sits on the water. Placing one automatically links the other within 5 blocks.","Full in 30 minutes, can be hauled in from 1 minute: 1 to 5 catches depending on how full it is, with the usual bonuses. Catches go straight into your inventory.","When hauled in full, 10% chance that a living dolphin, turtle or axolotl appears next to it.","Right-click the net or its float: hauls in the catches. Shift + right-click the net: hauls in its contents (if the minimum minute has passed) then picks it up; on the float: only picks up the float.","3 nets per player, but as many floats as you like. Only you can use them."]},{"lvl":90,"title":"Light Step on Water","text":"You can walk and run on water. Crouch to dive."}],"xnotes":{"goals":["Fishing, bucket-capturing and killing a fish are three separate actions: each has its own bonuses.","A fishing rod only counts as a treasure if it is enchanted.","The dolphin, the turtle and the squids (captured with B5) give their 20 XP, but count neither for the first capture nor for the collection."],"hire":["Fishing speed: fish bite faster on average. The bobber can sometimes make a slight jump."]}},"general":{"id":"general","title":"General rules","rules":[["Power progression",["Every job has two paths, A and B, with a single power to choose at each tier (levels 10, 30, 50, 75 and 100). The two paths each move at their own pace: after B1, you can perfectly well take A1.","A power not chosen at a tier stays available at the next tier. When you choose a power, its next version becomes available at the following tier.","Some tiers offer the same power on both paths: taking it on one counts for both."]],["Passives",["At levels 20, 40, 60 and 90, every job unlocks a passive automatically, with nothing to choose. A chat message announces its name and description.","Two exceptions: the Builder has a 5th passive at level 100 (Reclaim a Building), and the Breeder a second passive at level 60 (Improved Capture Net).","Unlocked passives are listed in the job's card on the /jobs screen (J key), under the bonuses. Those you do not have yet do not appear there."]],["Shift + right-click reminder",["When you aim at a target on which one of your passives allows a Shift + right-click, a small “Shift + right-click: …” text appears under the crosshair for 3 seconds, then fades. It reappears when you aim at another target.","It only appears if the action is really possible for you: right job, right level, right item in hand, a target that belongs to you.","It covers the beacon (Enchanter 40), the enchanting table with an enchanted item (Enchanter 60) or a bag (Explorer 40), your nets, floats and placed rods (Fisher), and one of your buildings with the matching empty plan (Builder 100)."]],["Bonuses and XP go together",["A job bonus only applies to an action that gives job XP. Breaking a block placed by a player or killing a spawner monster therefore triggers no loot bonus."]],["One-time bonuses",["Every job offers “first time” bonuses (first element of each type) and collection bonuses (gathering everything), paid out only once.","Leaving a job resets these histories: when you take it back, you can earn them again.","The hire gifts (first plan, pair of cows, enchanting table) are only given once, even if you take the job again."]],["“Goals” button",["In the /jobs screen, the “Goals” button (under “Leave” and “Powers”) shows where you stand in the job's one-time bonuses: counter, reward, and each element in green if obtained, in gray if still to do.","If the job has both kinds of bonuses, first choose “First” or “Completion”. “Refresh” reloads the list.","The Miner only has collections and the Builder only “first times”. For the Builder, blocks already placed are a simple counter; plans and building types are listed one by one."]],["Getting a second job",["The Farmer's level 100 power (toward the Breeder) and the Breeder's (toward the Farmer) let you take the other job from level 50, without the usual level requirement. You only need a free job slot (3 at most)."]]]},"commandes":[{"cmd":"/jobs","job":"general","lvl":1,"need":"All players","text":"Opens the jobs screen: levels, powers to choose and the “Goals” button.","cd":""},{"cmd":"/jobs leave <job> confirm","job":"general","lvl":1,"need":"All players","text":"Leaves a job. Its one-time bonuses are reset.","cd":""},{"cmd":"/tpaccept","job":"general","lvl":1,"need":"All players","text":"Accepts an Explorer's teleport request, within 60 seconds.","cd":""},{"cmd":"/flat","job":"batisseur","lvl":1,"need":"When you take the job","text":"Levels the ground around you: 5 blocks and 10 blocks tall, then 10 × 20 at level 40 and 20 × 30 at level 60. Gives 100 XP.","cd":""},{"cmd":"/plans","job":"batisseur","lvl":1,"need":"When you take the job","text":"Shows the available plans, official and custom, and lets you take another copy of one.","cd":""},{"cmd":"/undo","job":"batisseur","lvl":1,"need":"When you take the job","text":"Undoes your last build made with a plan, and removes the XP it gave.","cd":""},{"cmd":"/plans equerre","job":"batisseur","lvl":10,"need":"Power A1","text":"Gives you back an Architect's Square if you lost yours.","cd":""},{"cmd":"/plans supprimer <name>","job":"batisseur","lvl":10,"need":"Power A1","text":"Deletes one of your custom plans, after confirmation.","cd":""},{"cmd":"/feuilles","job":"bucheron","lvl":50,"need":"Power A3","text":"Turns the leaf drop on or off when you fell a tree. The trunk falls either way.","cd":""},{"cmd":"/deforestation","job":"bucheron","lvl":100,"need":"Power A5","text":"Fells every tree within 16 blocks, up to 2,000 blocks.","cd":"30 min"},{"cmd":"/woodseed","job":"bucheron","lvl":100,"need":"Power B5","text":"Gives a sapling of every tree in the game.","cd":"8 h"},{"cmd":"/fly","job":"chasseur","lvl":60,"need":"Level 60 passive","text":"Fly for 3 seconds.","cd":"5 min"},{"cmd":"/immun","job":"chasseur","lvl":90,"need":"Level 90 passive","text":"2 seconds of invincibility, triggered on your next right-click.","cd":"30 min"},{"cmd":"/whistle","job":"eleveur","lvl":60,"need":"Level 60 passive","text":"Calls your animals within 32 blocks to you.","cd":""},{"cmd":"/jobs boost <job>","job":"eleveur","lvl":100,"need":"Level 100","text":"Chooses the job that gets +20% XP. Can be changed at will.","cd":""},{"cmd":"/bottlexp","job":"enchanteur","lvl":30,"need":"Power B2","text":"Gives a stack of experience bottles.","cd":"8 h"},{"cmd":"/resetpower <job>","job":"enchanteur","lvl":90,"need":"Level 90 passive","text":"Gives a special book; while holding it, cancels the last power chosen in that job.","cd":"24 h"},{"cmd":"/immortel","job":"enchanteur","lvl":100,"need":"Power A5","text":"Gives a book to combine at the anvil with a weapon: it saves you from death once.","cd":"48 h"},{"cmd":"/meal","job":"explorateur","lvl":50,"need":"Power A3","text":"Fills your hunger and saturation.","cd":"30 min"},{"cmd":"/tpa <player>","job":"explorateur","lvl":75,"need":"Power A4 · B4","text":"Asks to teleport to a player, who must accept with /tpaccept.","cd":""},{"cmd":"/treasure","job":"explorateur","lvl":75,"need":"Power A4 · B4","text":"Points to the nearest loot structure, within 1,000 blocks.","cd":"12 h"},{"cmd":"/compass structure <structure>","job":"explorateur","lvl":90,"need":"Level 90 passive","text":"Points to the nearest structure of that type. The stronghold is excluded.","cd":"24 h, shared with /compass biome"},{"cmd":"/compass biome <biome>","job":"explorateur","lvl":90,"need":"Level 90 passive","text":"Points to the nearest biome of that type.","cd":"24 h, shared with /compass structure"},{"cmd":"/spot","job":"explorateur","lvl":100,"need":"Power A5 · B5","text":"Saves a teleport point, forgotten when the server restarts.","cd":""},{"cmd":"/tpspot","job":"explorateur","lvl":100,"need":"Power A5 · B5","text":"Teleports you to the point saved with /spot.","cd":""},{"cmd":"/moissonneuse","job":"fermier","lvl":90,"need":"Level 90 passive","text":"Turns on or off the automatic harvesting and replanting of mature crops as you pass.","cd":""},{"cmd":"/surface","job":"mineur","lvl":50,"need":"Power A3 · B3","text":"Takes you back to the surface, just above you.","cd":"60 s"},{"cmd":"/vein","job":"mineur","lvl":60,"need":"Level 60 passive","text":"Turns the vein miner on or off on your pickaxe: right-click an ore and the whole vein of the same ore is harvested, up to 128 blocks.","cd":""},{"cmd":"/radar","job":"mineur","lvl":90,"need":"Level 90 passive","text":"Counts every ore in your chunk and the 8 chunks around it, over 48 blocks in height.","cd":"30 s"},{"cmd":"/foreuse","job":"mineur","lvl":100,"need":"Power B5","text":"Turns on or off 3 × 3 × 3 cube mining, with a pickaxe in hand.","cd":""},{"cmd":"/fishegg","job":"pecheur","lvl":100,"need":"Power A5","text":"Gives an egg of each fish, plus tadpole and axolotl.","cd":"24 h"}]},"fr":{"batisseur":{"id":"batisseur","title":"BÂTISSEUR","sections":{"GAIN D'XP":["100 XP à chaque utilisation de /flat.","1 XP par bloc posé, à la main comme pendant la construction d'un plan. Certains blocs peuvent valoir davantage.","À la main, un bloc ne rapporte qu'une fois par emplacement : casser puis reposer le même bloc au même endroit ne redonne rien, mais poser un bloc différent (une rénovation) rapporte à nouveau. La construction d'un plan rapporte toujours l'XP de chaque bloc."],"CHOIX DU MÉTIER":["Donne la commande /flat, qui aplanit le terrain sur 5 cases autour de toi, jusqu'à 10 blocs de hauteur. Les blocs détruits sont perdus, quel que soit ton niveau.","Donne aussi le premier plan, la petite cabane : utilisable dès le niveau 2, et tu peux commencer à le remplir tout de suite. Il n'est offert qu'une fois : quitter puis reprendre le métier ne le redonne pas."],"CONCEPT DU PLAN":["Un plan est un objet qui garde en mémoire les ressources déjà déposées. Il reste inutilisable tant qu'il n'est pas rempli.","Tu peux le ranger, le déplacer ou l'échanger : sa progression le suit."],"REMPLISSAGE":["Tiens le plan et fais un clic droit : il prend dans ton inventaire tout ce qui lui manque, dans l'ordre de son coût, sans jamais prendre plus que nécessaire.","Seul ton inventaire est utilisé, pas les coffres ni les tonneaux."],"INFOBULLE (CLIENT)":["L'infobulle du plan affiche chaque ressource avec sa progression (« Pierre : 32/64 ») et le total (« Progression : 71 % »).","Les ressources complètes sont regroupées sur une seule ligne, et seules les 6 premières ressources manquantes sont listées (« … et N de plus »).","Pour tout voir, tiens le plan et appuie sur la touche « Ouvrir les métiers » : chaque ressource y figure avec son icône, sa progression et une barre globale."],"PLAN PRÊT":["Un plan rempli change d'apparence et prend un reflet enchanté."],"UTILISATION":["Tiens le plan, fais un clic gauche sur un bloc pour ancrer l'aperçu, puis un clic droit : un hologramme montre le bâtiment, que tu peux faire pivoter avec une touche. Les touches à utiliser s'affichent au-dessus de la barre d'objets.","L'aperçu fonctionne même avec un plan incomplet, pour choisir l'emplacement à l'avance ; seule la confirmation exige un plan rempli.","Après confirmation, le bâtiment se construit petit à petit, le plan est consommé et tu gagnes de l'XP de Bâtisseur."]},"tiers":[{"lvl":10,"A":"Équerre d'architecte : crée tes propres plans. 1 plan personnalisé jusqu'à 10 × 10 × 10","B":"85 % des blocs suffisent pour construire un plan (au lieu de 100 %)","nA":"Tout le fonctionnement est décrit dans « Tes propres plans », plus bas.","nB":"S'applique à tous les plans, officiels comme personnalisés."},{"lvl":30,"A":"Jusqu'à 3 plans personnalisés de 20 × 20 × 20","B":"Supprime 1 ligne de ressource au choix d'un plan encore vide","nB":"Tiens un plan encore totalement vide et appuie sur « Ouvrir les métiers » pour retirer la ligne. Dès le premier dépôt, ce n'est plus possible, et une ligne supprimée n'est jamais remboursée."},{"lvl":50,"A":"Jusqu'à 3 plans personnalisés de 40 × 40 × 40","B":"65 % des blocs suffisent pour construire un plan"},{"lvl":75,"A":"Jusqu'à 5 plans personnalisés de 50 × 40 × 50","B":"Supprime jusqu'à 3 lignes de ressource d'un plan encore vide","nB":"Remplace B2 : 3 lignes en tout, pas 3 de plus."},{"lvl":100,"A":"L'équerre capture aussi les animaux de la zone : ils réapparaissent quand tu construis le plan","B":"25 % des blocs suffisent pour construire un plan","nA":"20 animaux au maximum. Détails dans « Tes propres plans », plus bas."}],"plans":[{"name":"Petite cabane en bois","unlock":1,"use":2,"blocks":112,"extra":"Vitres offertes"},{"name":"Réserve en bois","unlock":1,"use":5,"blocks":163,"extra":"Annexe de la cabane : 8 coffres et 6 tonneaux de rangement, tonneaux offerts"},{"name":"Petite Forge","unlock":5,"use":10,"blocks":274,"extra":"Enclume et chaudron de lave offerts"},{"name":"Statue de Mortier, mascotte du Bâtisseur","unlock":10,"use":15,"blocks":1189,"extra":""},{"name":"Ventre-Fournaise, gardien du portail","unlock":15,"use":20,"blocks":1202,"extra":""},{"name":"Ruche","unlock":20,"use":25,"blocks":1250,"extra":"5 ruches livrées pleines (15 abeilles qui y reviennent). Les blocs à base de miel (rayons, blocs de miel, ruches, bougies jaunes) ne coûtent qu'un exemplaire chacun"},{"name":"Maison médiévale","unlock":25,"use":30,"blocks":3112,"extra":""},{"name":"Jeune Ogrest","unlock":30,"use":35,"blocks":3260,"extra":""},{"name":"Thermes de l'Outre-Monde","unlock":35,"use":40,"blocks":3350,"extra":""},{"name":"Pagode","unlock":40,"use":45,"blocks":4165,"extra":""},{"name":"Jardins suspendus","unlock":45,"use":50,"blocks":4585,"extra":"Plantes aquatiques offertes"},{"name":"Phare et petit port","unlock":50,"use":55,"blocks":6080,"extra":"Bassin du port creusé sur 3 blocs sous le point de pose, 2 barques amarrées, feu du phare qui tourne dès la construction (un bouton l'arrête ou le relance)"},{"name":"Navire","unlock":55,"use":60,"blocks":6200,"extra":""},{"name":"Dirigeable","unlock":60,"use":65,"blocks":3500,"extra":"Hélices qui tournent dès la construction"},{"name":"Serre botanique","unlock":65,"use":70,"blocks":5700,"extra":"2 ruches livrées pleines (6 abeilles qui y reviennent)"},{"name":"Arène","unlock":70,"use":75,"blocks":8150,"extra":"2 herses de porte et 4 enclos qui s'ouvrent avec des boutons"},{"name":"Cathédrale","unlock":75,"use":80,"blocks":19542,"extra":""},{"name":"Château fort (herse et pont-levis animés)","unlock":80,"use":85,"blocks":17426,"extra":""},{"name":"Temple impérial","unlock":85,"use":90,"blocks":24762,"extra":""},{"name":"Villa de bord de mer","unlock":90,"use":95,"blocks":16400,"extra":"Peuplée dès la construction de poissons tropicaux, dauphins, calmars lumineux et tortues, qui ne disparaissent jamais ; /undo les retire avec le bâtiment"}],"goals":[["Premier bloc de chaque type posé","×10 son XP","first"],["Premier bâtiment de chaque plan","100 × niveau requis","first"],["Premier bâtiment de type « maison »","1 000 XP","first"],["Premier bâtiment de type « utilitaire »","5 000 XP","first"],["Premier bâtiment de type « décoration »","5 000 XP","first"]],"custom":[["Obtenir l'équerre",["Choisir A1 te donne un bloc « équerre d'architecte ». Si tu le perds, /plans equerre t'en redonne un."]],["Délimiter ta construction",["Pose l'équerre près de ta construction et fais un clic droit dessus. Son écran règle le décalage (X, Y, Z), la taille (X, Y, Z) et le nom du plan ; un contour en fil de fer suit tes réglages en direct.","« Prévisualisation » ferme l'écran sans rien enregistrer, pour vérifier que le contour englobe bien ta construction. « Dessiner » crée le plan.","Nombre de plans et taille maximale dépendent de tes pouvoirs A1 à A4 : la limite la plus haute atteinte s'applique."]],["Ce que coûte ton plan",["Chaque bloc de la zone doit être fourni, même la terre, la pierre ou les plantes. Seuls l'air et l'eau sont gratuits.","Le calcul suit les règles des plans officiels : une porte ou un lit compte pour un, une dalle double pour deux, une torche murale pour une torche, une culture pour sa graine, un pot de fleurs pour le pot et sa plante. Les essences de bois sont interchangeables.","L'équerre est ignorée si elle se trouve dans la zone."]],["Captures refusées",["La zone contient un bloc impossible à obtenir en survie : bedrock, spawner, portail, bloc de commande… Le message indique le bloc et sa position.","La zone contient des blocs d'un bâtiment construit par un autre joueur avec un plan.","La zone dépasse ta taille maximale, tu as déjà ton nombre maximum de plans, ou le nom est déjà pris par un de tes plans."]],["Animaux (A5)",["Avec A5, les animaux de la zone (20 au maximum) sont capturés avec le plan : ils disparaissent sans mourir, avec leur couleur, leur âge et leur apprivoisement.","Ils réapparaissent à leur place quand tu construis le plan, gratuitement. Sans A5, les animaux restent où ils sont.","/undo ou une récupération retirent les animaux de cette construction, pour qu'on ne puisse pas les multiplier."]],["Un plan qui n'appartient qu'à toi",["Toi seul peux remplir, prévisualiser et construire tes plans personnalisés.","Le plan disparaît si tu le jettes ou s'il arrive dans l'inventaire d'un autre joueur. À ta mort, il disparaît toujours, mais les ressources déjà déposées te sont rendues."]],["Gérer tes plans",["/plans affiche tes plans personnalisés dans une section à part, où tu peux reprendre gratuitement un exemplaire vide de chacun.","/plans supprimer <nom> supprime un plan après confirmation, y compris les exemplaires déjà dans ton inventaire.","Quitter le métier ne supprime pas tes plans, mais ils restent inutilisables sans le métier et le pouvoir A1."]],["XP",["Construire un plan personnalisé rapporte l'XP normale de chaque bloc et le bonus de premier bloc de chaque type, mais jamais le bonus de premier plan ni celui de type de bâtiment.","Créer le plan ne rapporte pas d'XP."]]],"passives":[{"lvl":20,"title":"XP de /flat","text":"/flat rapporte 1 XP par bloc naturel détruit."},{"lvl":40,"title":"/flat agrandi","text":"/flat passe à 10 cases autour de toi et 20 blocs de hauteur."},{"lvl":60,"title":"Bâtiments protégés","text":"/flat passe à 20 cases autour de toi et 30 blocs de hauteur, et les blocs de tes bâtiments construits avec un plan résistent aux explos
